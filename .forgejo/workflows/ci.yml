# Forgejo CI for private `internal/**` branches.
#
# Epistola's Forgejo (code.int.epistola.io) keeps a copy of this repository that is synced from
# GitHub, plus private `internal/**` branches (for example a security fix before its disclosure)
# that never reach GitHub. This workflow checks those branches on Forgejo's own runners.
#
# It only exists on Forgejo's side: GitHub ignores `.forgejo/`, and once this directory exists
# Forgejo ignores `.github/workflows`, so the synced public branches and tags start nothing there.
# Publishing (images, charts, Maven, releases) stays with GitHub. The checks mirror build.yml;
# GitHub-only parts (artifact hand-off between jobs, coverage badge, SBOM and SARIF upload) are
# left out. Actions are referenced by full URL because Forgejo resolves short names against its
# own action mirror, not github.com. Artifacts go through Forgejo's fork of upload-artifact: upstream
# v4+ refuses to run anywhere but github.com.
name: CI (Forgejo, internal branches)

on:
  push:
    branches: ["internal/**"]
  workflow_dispatch:

jobs:
  backend:
    name: Checks, unit & integration tests
    runs-on: large
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The migration, changelog and catalog checks compare against origin/main.
          fetch-depth: 0

      - name: Setup tools with mise
        uses: https://github.com/jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # The editor bundle is a Gradle input (modules/editor packages dist/ into its jar).
      - name: Build frontend
        run: pnpm build

      - name: Setup Gradle
        uses: https://github.com/gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      # Compiling and testing are two Gradle runs here, unlike build.yml. A runner here gives a job
      # less memory than a GitHub runner (16 GB): in one run, the Kotlin daemon (~1.9 GB) and the
      # compile phase's worker processes (~1 GB each) stay alive next to the Gradle daemon (~2.4 GB)
      # while the test JVMs start, and a 9 GB job was OOM-killed with only two of them. Stopping the
      # daemons in between hands that memory to the tests, which then compile nothing.
      - name: Checks and compile
        run: gradle checkMigrationVersions checkChangelogFragments checkBundledCatalogVersions ktlintCheck checkContractVersionAlignment testClasses

      - name: Stop the build daemons
        run: |
          gradle --stop
          pkill -f KotlinCompileDaemon || true

      # On CI the build gives every core a test JVM slot, which suits a GitHub runner (4 cores) but
      # not one with 8 cores in 9 GB. Slots come from the job's memory limit instead: 3 GB for the
      # Gradle daemon, then 1.75 GB per Spring test JVM (-Xmx1g plus metaspace and native memory,
      # measured at 1.2-1.3 GB). Testcontainers' databases run outside the job's limit.
      - name: Size test JVM slots from the job's memory limit
        run: |
          limit="$(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo max)"
          if [ "$limit" = max ]; then mb=$(( $(awk '/^MemTotal:/ {print $2}' /proc/meminfo) / 1024 ))
          else mb=$(( limit / 1048576 )); fi
          slots=$(( (mb - 3072) / 1792 )); cores="$(nproc)"
          [ "$slots" -lt 1 ] && slots=1
          [ "$slots" -gt "$cores" ] && slots="$cores"
          echo "Memory limit ${mb} MB, ${cores} cores: ${slots} test JVM slot(s)"
          echo "TEST_JVM_SLOTS=$slots" >> "$GITHUB_ENV"

      - name: Unit and integration tests
        run: gradle -PtestJvmSlots="$TEST_JVM_SLOTS" test

      - name: Upload test reports on failure
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: backend-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup tools with mise
        uses: https://github.com/jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:check

      - name: Lint CSS
        run: pnpm lint:css

      - name: Check format
        run: pnpm format:check

      - name: Check license metadata
        run: pnpm license:check

      - name: Check agent instructions
        run: pnpm agents:check

      - name: Test frontend
        run: pnpm test

  ui:
    name: UI tests (Playwright)
    runs-on: large
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup tools with mise
        uses: https://github.com/jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Setup Gradle
        uses: https://github.com/gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Install Playwright browsers
        run: |
          PLAYWRIGHT_VERSION=$(grep '^playwright\s*=' gradle/libs.versions.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          npx --yes "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium

      - name: UI tests
        run: gradle uiTest

      - name: Upload Playwright traces and test reports on failure
        if: failure()
        uses: https://code.forgejo.org/forgejo/upload-artifact@cb8afe72b42edc798abfb8fcb556cf660d894245 # v5
        with:
          name: playwright-failures
          path: |
            apps/epistola/build/playwright-traces/
            apps/epistola/build/reports/tests/
          retention-days: 7
          if-no-files-found: ignore
