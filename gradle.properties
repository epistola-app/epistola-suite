# App version — the source of truth. Dev carries the next version with -SNAPSHOT;
# a release strips it, tags v<version>, then re-opens the next -SNAPSHOT (see the
# `release` skill). CI validates the v* tag equals this value. A -PreleaseVersion
# override (PR snapshot builds) still wins over this.
version=2.1.0

# The Cloud Native Buildpacks builder every bootBuildImage uses. It picks the buildpacks,
# and with them the JRE the images ship, so it is pinned to a version and digest rather than
# Spring Boot's default of :latest. Renovate updates it through the regex manager in
# renovate.json, which reads the comment line below; keep the two lines together.
# renovate: datasource=docker depName=paketobuildpacks/builder-noble-java-tiny
epistola.image.builder=paketobuildpacks/builder-noble-java-tiny:0.0.222@sha256:96678722f0d61f6102ceccd83f829a935a304fc353bbd5b20bbbfd90c28533b8

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# Treat Gradle deprecations as build failures so upgrades cannot silently accumulate debt.
org.gradle.warning.mode=fail

# Cap the Gradle and Kotlin compile daemons. Without these, both run on stock
# defaults locally; the Spring Boot 4.1.0 / Kotlin 2.3.21 bump (#545) raised the
# Kotlin compiler's footprint past that default, GC-thrashing the daemon into
# "OutOfMemoryError: GC overhead limit exceeded" on compileKotlin. CI sets its
# own heaps (see .github/workflows/codeql.yml) and is unaffected by these.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g
kotlin.daemon.jvmargs=-Xmx2g
