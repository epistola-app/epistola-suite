# The support protocol as a partner implements it (ADR 0053 step 3): what an Epistola Suite
# installation calls on a support connection it signs in to with a token the partner issued. Derived
# from docs/support-api.yaml, the Epistola support service's own file: the operations here are the same,
# so one connector serves both (SupportPartnerSpecTest holds them together). docs/support-partners.md
# explains behaviour.
openapi: 3.0.3
info:
  title: Epistola support connection (partner)
  version: "1"
  description: |
    What an Epistola Suite installation sends to and reads from a support connection: support
    requests, their messages and attachments, the changes feed back, and usage per hour. Every call
    carries the bearer token the partner issued to the installation. A service the token does not
    grant answers `403` (`insufficient_scope`); `GET /api/v1/connection` says which services it grants.
    The paths are relative to the connection's endpoint, which the installation is configured with or
    reads from the partner's discovery document (`GET https://{domain}/.well-known/epistola.json`).
servers:
  - url: "{endpoint}"
    variables:
      endpoint:
        default: https://desk.partner.example/epistola
security:
  - bearer: []
paths:
  /api/v1/connection:
    get:
      summary: The registration as it is now
      responses:
        "200":
          description: The registration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { $ref: "#/components/responses/InvalidToken" }
  /api/v2/requests/{tenantKey}/{suiteRequestId}:
    put:
      summary: Send a support request (idempotent; the first content wins). Its question follows as a message.
      parameters:
        - $ref: "#/components/parameters/TenantKey"
        - { name: suiteRequestId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RequestSubmission" }
      responses:
        "201": { $ref: "#/components/responses/RequestStored" }
        "200": { $ref: "#/components/responses/RequestStored" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "507": { $ref: "#/components/responses/QuotaExceeded" }
  /api/v2/requests/{requestId}/attachments/{suiteAttachmentId}:
    put:
      summary: Attach an image (idempotent per suite attachment id)
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - {
            name: suiteAttachmentId,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          }
        - { name: filename, in: query, required: false, schema: { type: string, maxLength: 255 } }
      requestBody:
        required: true
        content:
          image/png: { schema: { type: string, format: binary } }
          image/jpeg: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        "201": { $ref: "#/components/responses/AttachmentStored" }
        "200": { $ref: "#/components/responses/AttachmentStored" }
        "401": { $ref: "#/components/responses/InvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v2/requests/{requestId}/messages/{suiteMessageId}:
    put:
      summary: Add a message (idempotent per suite message id); a STATUS message also sets the status
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - { name: suiteMessageId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Message" }
      responses:
        "201": { $ref: "#/components/responses/MessageStored" }
        "200": { $ref: "#/components/responses/MessageStored" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "507": { $ref: "#/components/responses/QuotaExceeded" }
  /api/v2/requests/changes:
    post:
      summary: Acknowledge what the installation handled, and get the staff replies, status and priority after it, in order
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledgeUpTo:
                  type: integer
                  format: int64
                  minimum: 0
                  description: "The last change's sequence the installation handled; at most the last one handed out. Never moves back."
                limit: { type: integer, default: 100, description: "Clamped to 1..500." }
      responses:
        "200":
          description: One page of changes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Changes" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/v1/usage/hours/{hour}:
    put:
      summary: Report a finished UTC hour's readings per tenant; replaces the last report for that hour
      parameters:
        - name: hour
          in: path
          required: true
          description: The start of the hour, such as 2026-11-07T09:00:00Z
          schema: { type: string, format: date-time }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsageHour" }
      responses:
        "200":
          description: Taken
          content:
            application/json:
              schema:
                type: object
                required: [hour, tenants]
                properties:
                  hour: { type: string, format: date-time }
                  tenants: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "401": { $ref: "#/components/responses/InvalidToken" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /.well-known/epistola.json:
    get:
      summary: The partner's preset for connecting to it (served at the partner's domain, not under the endpoint)
      security: []
      responses:
        "200":
          description: The discovery document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerDiscovery" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantKey:
      name: tenantKey
      in: path
      required: true
      schema: { type: string, maxLength: 63, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$" }
    RequestId:
      name: requestId
      in: path
      required: true
      description: The partner's id for the request, from its answer to sending the request; any string the partner chooses.
      schema: { type: string, minLength: 1, maxLength: 255 }
  responses:
    Registered:
      description: Registered (201) or registered again with the same key (200)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Registration" }
    RequestStored:
      description: Stored (201) or held already (200)
      content:
        application/json:
          schema:
            type: object
            required: [requestId]
            properties:
              requestId: { type: string, minLength: 1, maxLength: 255 }
              url: { type: string, nullable: true }
    AttachmentStored:
      description: Stored (201) or held already (200)
      content:
        application/json:
          schema:
            type: object
            required: [attachmentId]
            properties:
              attachmentId: { type: string, format: uuid }
    MessageStored:
      description: Stored (201) or held already (200)
      content:
        application/json:
          schema:
            type: object
            required: [messageId]
            properties:
              messageId: { type: string, minLength: 1, maxLength: 255 }
    ReleaseStored:
      description: Stored (201) or held already (200)
      content:
        application/json:
          schema:
            type: object
            required: [contentHash]
            properties:
              contentHash: { $ref: "#/components/schemas/ContentHash" }
    InvalidRequest:
      description: invalid_request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: not_found (also for another installation's request)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    QuotaExceeded:
      description: quota_exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InvalidToken:
      description: invalid_token (RFC 6750)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: insufficient_scope, or service_paused while Epistola paused the service
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        error_description: { type: string, nullable: true }
        scope: { type: string, description: "The scope the endpoint needs (403 only)." }
    Scope:
      type: string
      description: A service name. Unknown names are possible and are ignored, never an error.
    ContentHash:
      type: string
      pattern: "^v[0-9]{1,3}:[0-9a-f]{16,128}$"
    RegistrationRequest:
      type: object
      required: [jwks, epistola_installation_id]
      properties:
        client_name: { type: string, maxLength: 200 }
        grant_types: { type: array, items: { type: string } }
        token_endpoint_auth_method: { type: string }
        jwks:
          type: object
          required: [keys]
          properties:
            keys: { type: array, minItems: 1, maxItems: 1, items: { type: object } }
        software_id: { type: string }
        software_version: { type: string }
        epistola_installation_id: { type: string, format: uuid }
        epistola_environment: { type: string, maxLength: 200 }
        epistola_company_name: { type: string, maxLength: 200 }
        epistola_admin_email: { type: string, maxLength: 200 }
        epistola_node_id: { type: string, maxLength: 200 }
    Registration:
      type: object
      required: [client_id, epistola_claim_code, epistola_status]
      properties:
        client_id: { type: string }
        client_id_issued_at: { type: integer, format: int64 }
        client_name: { type: string, nullable: true }
        grant_types: { type: array, items: { type: string } }
        token_endpoint_auth_method: { type: string }
        jwks: { type: object }
        epistola_claim_code:
          type: string
          description: A reference to mention when contacting Epistola; nothing needs to send it.
        epistola_status: { $ref: "#/components/schemas/RegistrationStatus" }
        epistola_claim_code_expires_at: { type: string, format: date-time, nullable: true }
    RegistrationStatus:
      type: string
      description: Values may be added; treat an unknown one as not active.
      enum: [PENDING, ACTIVE, DECLINED, REVOKED, DISCONNECTED]
    Connection:
      description: "As the support service answers it; a partner need not name a client or an installation id, only the status and the services it grants."
      type: object
      required: [status, scopes]
      properties:
        clientId: { type: string }
        installationId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/RegistrationStatus" }
        scopes:
          type: array
          description: The granted scopes, paused ones included.
          items: { $ref: "#/components/schemas/Scope" }
        activatedAt: { type: string, format: date-time, nullable: true }
        claimCodeExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: While PENDING, when the registration is deleted unless Epistola activates it.
        declinedAt: { type: string, format: date-time, nullable: true }
        pause:
          type: object
          nullable: true
          description: Services Epistola holds back for a while; null when nothing is paused.
          required: [scopes, since, reason]
          properties:
            scopes: { type: array, items: { $ref: "#/components/schemas/Scope" } }
            since: { type: string, format: date-time }
            until:
              type: string
              format: date-time
              nullable: true
              description: When the pause ends by itself; null until Epistola resumes.
            reason: { type: string, maxLength: 200, description: As Epistola staff wrote it. }
    RequestKind: { type: string, enum: [BUG, FEATURE_REQUEST, QUESTION, OTHER] }
    RequestPriority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    RequestStatus: { type: string, enum: [OPEN, IN_PROGRESS, RESOLVED, CLOSED] }
    RequestSubmission:
      type: object
      required: [title, kind, requestedPriority]
      properties:
        title: { type: string, maxLength: 1000 }
        kind: { $ref: "#/components/schemas/RequestKind" }
        requestedPriority:
          allOf: [{ $ref: "#/components/schemas/RequestPriority" }]
          description: The submitter's; staff set the priority they work with, which reaches the installation as a change.
        status: { $ref: "#/components/schemas/RequestStatus" }
        sourceUrl: { type: string, maxLength: 4096, nullable: true }
        consoleLogs: { type: string, nullable: true }
        serverLogs:
          type: string
          nullable: true
          description: The installation's log lines of the submitter's recent requests (a JSON array, oldest first), when attached; at most 256 KiB
        metadata: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        requesterRef:
          type: string
          pattern: "^p-[0-9a-f]{16}$"
          description: Who submitted it, as the installation's person reference; stable per person, never a name.
    Message:
      type: object
      required: [kind]
      description: >-
        QUESTION (the request's description) and REPLY need a body, a REPLY also its author: authorName,
        or authorRef alone from an installation that keeps names in. STATUS needs the status it sets.
      properties:
        kind: { type: string, enum: [QUESTION, REPLY, STATUS] }
        authorName: { type: string, maxLength: 200 }
        authorEmail: { type: string, maxLength: 320, nullable: true }
        authorRef:
          type: string
          pattern: "^p-[0-9a-f]{16}$"
          description: Who wrote it, as the installation's person reference.
        body: { type: string }
        status: { $ref: "#/components/schemas/RequestStatus" }
        createdAt: { type: string, format: date-time }
    Changes:
      type: object
      required: [changes, hasMore, lastSequence]
      properties:
        changes:
          type: array
          items:
            type: object
            required: [sequence, requestId, tenantKey, suiteRequestId, occurredAt, type]
            properties:
              sequence: { type: integer, format: int64 }
              requestId: { type: string, minLength: 1, maxLength: 255 }
              tenantKey: { type: string }
              suiteRequestId: { type: string, format: uuid }
              occurredAt: { type: string, format: date-time }
              type: { type: string, enum: [MESSAGE, STATUS, PRIORITY, ESCALATION] }
              reason:
                {
                  type: string,
                  nullable: true,
                  description: "ESCALATION only: what the connection's staff wrote when asking the installation to escalate.",
                }
              message:
                type: object
                required: [messageId, kind, authorName, body]
                properties:
                  messageId: { type: string, minLength: 1, maxLength: 255 }
                  kind: { type: string, enum: [QUESTION, REPLY, STATUS] }
                  authorName: { type: string }
                  authorEmail: { type: string, nullable: true }
                  body: { type: string }
              status: { $ref: "#/components/schemas/RequestStatus" }
              priority: { $ref: "#/components/schemas/RequestPriority" }
        hasMore: { type: boolean }
        lastSequence:
          {
            type: integer,
            format: int64,
            nullable: true,
            description: "The last change's sequence, to acknowledge once handled; null on an empty page.",
          }
    UsageHour:
      type: object
      required: [tenants]
      properties:
        tenants:
          type: array
          maxItems: 10000
          items:
            type: object
            required: [tenant, generated, previews, generatedTotal, previewsTotal]
            properties:
              tenant:
                { type: string, description: "The tenant's key, or its confidential reference" }
              generated:
                {
                  type: integer,
                  format: int64,
                  minimum: 0,
                  description: Documents generated in the hour,
                }
              previews:
                {
                  type: integer,
                  format: int64,
                  minimum: 0,
                  description: Previews rendered in the hour,
                }
              generatedTotal:
                {
                  type: integer,
                  format: int64,
                  minimum: 0,
                  description: Documents generated since the installation started counting (billed from),
                }
              previewsTotal:
                {
                  type: integer,
                  format: int64,
                  minimum: 0,
                  description: Previews rendered since the installation started counting,
                }
    ReconcileRequest:
      type: object
      required: [bindings]
      properties:
        bindings: { type: array, maxItems: 10000, items: { $ref: "#/components/schemas/Binding" } }
    Binding:
      type: object
      required: [registry, namespace, key, version, contentHash]
      properties:
        registry: { type: string, maxLength: 255 }
        namespace: { type: string, maxLength: 255 }
        key: { type: string, maxLength: 255 }
        version: { type: string, maxLength: 128 }
        contentHash: { $ref: "#/components/schemas/ContentHash" }
        releasedAt: { type: string, format: date-time, nullable: true }
        deployments:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [environment, production]
            properties:
              environment: { type: string }
              production: { type: boolean }
        dependencies:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [registry, namespace, key, contentHash]
            properties:
              registry: { type: string }
              namespace: { type: string }
              key: { type: string }
              version: { type: string, nullable: true }
              contentHash: { $ref: "#/components/schemas/ContentHash" }
    ReconcileResult:
      type: object
      required: [missing, bindings, removed]
      properties:
        missing: { type: array, items: { $ref: "#/components/schemas/ContentHash" } }
        bindings: { type: integer }
        removed: { type: integer }
    PartnerDiscovery:
      type: object
      required: [support]
      properties:
        support:
          type: object
          required: [endpoint]
          properties:
            name: { type: string, description: "What the installation calls the connection." }
            endpoint:
              {
                type: string,
                format: uri,
                description: "The base URL the paths here are under; https.",
              }
            services: { type: array, items: { type: string, enum: [requests, usage] } }
            tenantIdentity:
              {
                type: string,
                enum: [named, confidential],
                description: "What the partner suggests it learns of tenants.",
              }
            telemetry: { type: string, enum: [pseudonymised, full] }
