[versions]
kotlin = "2.4.21"
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
graalvm-native = "1.1.18"
ktlint = "14.2.0"
# The ktlint engine the Gradle plugin runs; the plugin's own default lags behind (1.5.0).
ktlint-engine = "1.8.0"
htmx-spring-boot = "6.0.1"
cyclonedx = "3.5.1"
dependency-license-report = "3.1.5"
kover = "0.9.11"
semver4j = "6.0.0"
jdbi = "3.55.0"
json-schema-validator = "3.0.9"
jsonata = "0.9.10"
uuid-creator = "6.1.1"
spring-web = "7.0.10"
playwright = "1.64.0"
epistola-contract = "2.0.0"
# The support connection's keys and client assertions; the version Spring Security 7.1 uses.
nimbus-jose-jwt = "10.10"
# Checks the stand-in support service against docs/support-api.yaml (tests only).
swagger-request-validator = "2.46.1"
# Test only: decodes the OTLP payloads the support telemetry leg sends. The version Micrometer's
# OTLP registry ships with (outside the Spring Boot BOM).
otlp-proto = "1.10.0-alpha"
epistola-exchange-client = "0.1.1"
aws-sdk = "2.57.10"
guava = "33.8.0-jre"
spring-ai = "2.0.2"
archunit = "1.5.1"
# Generates and shrinks the command sequences of the catalog model test.
kotest = "6.2.7"
# One iText for the renderer and for every test that reads the PDFs it writes.
itext = "9.8.0"
# PDF/A and PDF/UA validation in tests only (GPL-3.0 or MPL-2.0; used under MPL-2.0)
verapdf = "1.30.4"
# Declared here because modules:generation is outside the Spring Boot BOM.
caffeine = "3.3.1"
# The Jackson line the Spring Boot BOM manages, for code outside the BOM (modules:generation test
# fixtures). Keep it on the BOM's line; the apps take Jackson from the BOM itself.
jackson = "3.1.7"
# Security override of the Spring Boot BOM's OpenTelemetry (1.62.0, CVE-2026-118259), applied by
# apps/epistola and apps/epistola-demo (pdfrender has no OpenTelemetry API). Drop it once the BOM
# manages this version or later.
opentelemetry = "1.67.0"

[libraries]
semver4j = { module = "org.semver4j:semver4j", version.ref = "semver4j" }
htmx-spring-boot-thymeleaf = { module = "io.github.wimdeblauwe:htmx-spring-boot-thymeleaf", version.ref = "htmx-spring-boot" }
jdbi-bom = { module = "org.jdbi:jdbi3-bom", version.ref = "jdbi" }
jdbi-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi" }
jdbi-kotlin = { module = "org.jdbi:jdbi3-kotlin", version.ref = "jdbi" }
jdbi-postgres = { module = "org.jdbi:jdbi3-postgres", version.ref = "jdbi" }
jdbi-jackson3 = { module = "org.jdbi:jdbi3-jackson3", version.ref = "jdbi" }
jdbi-spring = { module = "org.jdbi:jdbi3-spring", version.ref = "jdbi" }
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "json-schema-validator" }
jsonata = { module = "com.dashjoin:jsonata", version.ref = "jsonata" }
uuid-creator = { module = "com.github.f4b6a3:uuid-creator", version.ref = "uuid-creator" }
spring-web = { module = "org.springframework:spring-web", version.ref = "spring-web" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }
epistola-server-restapi = { module = "app.epistola.contract:server-kotlin-springboot4", version.ref = "epistola-contract" }
epistola-catalog = { module = "app.epistola.contract:epistola-catalog", version.ref = "epistola-contract" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
swagger-request-validator = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "swagger-request-validator" }
otlp-proto = { module = "io.opentelemetry.proto:opentelemetry-proto", version.ref = "otlp-proto" }
epistola-exchange-client = { module = "app.epistola.exchange:client", version.ref = "epistola-exchange-client" }
aws-bom = { module = "software.amazon.awssdk:bom", version.ref = "aws-sdk" }
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
kotest-property = { module = "io.kotest:kotest-property-jvm", version.ref = "kotest" }
itext-core = { module = "com.itextpdf:itext-core", version.ref = "itext" }
verapdf-validation = { module = "org.verapdf:validation-model", version.ref = "verapdf" }
itext-svg = { module = "com.itextpdf:svg", version.ref = "itext" }
itext-kernel = { module = "com.itextpdf:kernel", version.ref = "itext" }
caffeine = { module = "com.github.ben-manes.caffeine:caffeine", version.ref = "caffeine" }
# The Jackson BOM for code outside the Spring Boot BOM (see the `jackson` version above).
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }

# Gradle plugins consumed by buildSrc as regular dependencies
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlint" }
# Not a dependency: listed so Renovate tracks the engine version applied in the Kotlin conventions.
ktlint-engine = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint-engine" }
kover-gradle-plugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-native" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
cyclonedx = { id = "org.cyclonedx.bom", version.ref = "cyclonedx" }
dependency-license-report = { id = "com.github.jk1.dependency-license-report", version.ref = "dependency-license-report" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
