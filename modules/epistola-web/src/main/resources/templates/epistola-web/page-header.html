<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="page-header"
         th:with="
            pageDescription=${pageDescription} ?: null,
            backLinkHref=${backLinkHref} ?: null,
            backLinkLabel=${backLinkLabel} ?: null,
            searchPlaceholder=${searchPlaceholder} ?: 'Search...',
            searchUrl=${searchUrl} ?: null,
            searchTargetId=${searchTargetId} ?: null,
            searchableTotal=${searchableTotal} ?: null,
            searchTerm=${searchTerm} ?: '',
            showSearch=${searchUrl != null
                         and (searchableTotal == null or searchableTotal > 0 or searchTerm != '')},
            actions=${actions} ?: null,
            stage=${stage} ?: null
         "
         class="page-header">

        <div class="content">
            <a th:if="${backLinkHref != null and backLinkLabel != null}"
               th:href="${backLinkHref}"
               class="back-link">
                <th:block th:replace="~{epistola-web/icon :: icon(name='arrow-left', class='ep-icon ep-icon-sm')}" />
                <span th:text="${backLinkLabel}"></span>
            </a>
            <h1 data-testid="page-title">
                <!-- The id is a swap anchor (e.g. the template-rename OOB targets it);
                     data-testid stays a test-only soft contract. -->
                <span id="page-title-text" th:text="${pageTitle}"></span>
                <span th:if="${stage != null and stage.badgeClass != null}"
                      th:class="${'badge ' + stage.badgeClass}"
                      th:text="${stage.label}">Beta</span>
            </h1>
            <p th:if="${!#strings.isEmpty(pageDescription)}" th:text="${pageDescription}"></p>
        </div>

        <!--
          A search box appears only when there is something to search
          (.agents/rules/ui-affordances.md). A page opts in by putting searchableTotal in its
          model: the number of items this page's search can actually reach, which is the count
          under whatever filter the page already applies — the search URL carries that same
          filter, so a filtered-empty list has nothing to search either, and the filter control
          itself stays on screen to get back out of it. Leaving searchableTotal out means null,
          which shows the box, so every header that has not opted in is unaffected.

          searchTerm is the other half, and it is what stops this stranding anyone: with a term
          active the box stays even at zero results, or there would be no way to clear it. No
          search response re-renders this header anyway (they target the table), so the gate is
          only ever evaluated on a full page load.
        -->
        <div th:if="${showSearch or actions != null}" class="page-actions">
            <th:block th:if="${showSearch}">
                <th:block th:replace="~{fragments/search :: search-box(
                    placeholder=${searchPlaceholder},
                    searchUrl=${searchUrl},
                    targetId=${searchTargetId}
                )}"></th:block>
            </th:block>

            <th:block th:if="${actions != null}">
                <th:block th:replace="${actions}"></th:block>
            </th:block>
        </div>

    </div>

</body>
</html>
