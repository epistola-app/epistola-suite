spring:
  main:
    banner-mode: off
  datasource:
    hikari:
      # One shared Postgres serves every Spring test context, so these bounds are per context but
      # the budget is global. `minimum-idle` was the expensive part: a cached context that no test
      # is using still held its floor open, so the cost grew with the number of contexts rather
      # than with the work. Idle connections are now released instead.
      maximum-pool-size: 8
      minimum-idle: 0
      idle-timeout: 10000

epistola:
  logs:
    # Don't attach the DB log appender across the whole suite — capture/retention
    # tests opt in per-class with properties = ["epistola.logs.enabled=true"].
    enabled: false
  generation:
    polling:
      enabled: true
      interval-ms: 100
      max-concurrent-jobs: 2
