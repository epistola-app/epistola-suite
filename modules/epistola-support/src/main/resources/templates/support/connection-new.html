<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/*
    The add-connection dialog, rendered two ways off SupportPlatformHandler (docs/dialog-forms.md):
      - `dialog`, swapped into #dialog-mount by the page header's action (hx-get), or embedded in the
        list page's mount on direct navigation (openDialog=true);
      - `connection-form`, swapped in place when a domain is looked up (addPreset) or the values come
        back with an error.
    Model: serviceNames, and optionally addPreset, addForm.
    */-->
    <th:block th:fragment="dialog">
        <div th:replace="~{epistola-web/dialog :: dialog-shell(
            dialogId='add-connection-dialog',
            title='Add a support connection',
            closeUrl=@{/platform/support},
            content=~{::connection-form})}"></div>
    </th:block>

    <form th:fragment="connection-form" id="add-connection-form" method="post"
          th:action="@{/platform/support/connections}" th:hx-post="@{/platform/support/connections}"
          hx-target="#add-connection-form" hx-swap="outerHTML" th:with="pre=${addPreset}"
          data-testid="support-connection-add">
        <div th:replace="~{epistola-web/form-error :: form-error(id='add-connection-error')}"></div>
        <div class="ep-dialog-body ep-stack">
            <div class="alert alert-error" role="alert" th:if="${addError != null}" data-testid="support-connection-add-error" th:text="${addError}">The token is required.</div>
            <div class="form-group">
                <label class="ep-label" for="support-add-domain">Look up a domain</label>
                <div class="ep-row ep-gap-1">
                    <input class="ep-input" id="support-add-domain" type="text" name="domain" maxlength="253" placeholder="partner.example"
                           th:value="${addForm != null ? addForm.get('domain') : ''}">
                    <button type="button" class="ep-btn ep-btn-outline" data-testid="support-connection-lookup-submit"
                            th:hx-post="@{/platform/support/connections/lookup}" hx-include="#add-connection-form"
                            hx-target="#add-connection-form" hx-swap="outerHTML">Look up</button>
                </div>
                <span class="form-hint">Fills in what the domain publishes for connecting to it. Without it, fill in the fields yourself.</span>
            </div>
            <div class="form-group">
                <label class="ep-label" for="support-add-name">Name</label>
                <input class="ep-input" id="support-add-name" type="text" name="name" maxlength="100" required
                       th:value="${pre != null ? pre.name : (addForm != null ? addForm.get('name') : '')}">
            </div>
            <div class="form-group">
                <label class="ep-label" for="support-add-endpoint">Endpoint</label>
                <input class="ep-input" id="support-add-endpoint" type="text" name="endpoint" maxlength="2000" required placeholder="https://desk.partner.example/epistola"
                       th:value="${pre != null ? pre.endpoint : (addForm != null ? addForm.get('endpoint') : '')}">
            </div>
            <div class="form-group" role="radiogroup" aria-labelledby="support-add-auth-label" data-testid="support-connection-add-auth"
                 th:with="auth=${addForm != null and addForm.get('auth') == 'PRIVATE_KEY_JWT'} ? 'PRIVATE_KEY_JWT' : 'BEARER_TOKEN'">
                <span class="ep-label" id="support-add-auth-label">How this installation signs in</span>
                <label class="ep-row ep-gap-1"><input type="radio" name="auth" value="BEARER_TOKEN" th:checked="${auth == 'BEARER_TOKEN'}"> With a token the other side issued</label>
                <label class="ep-row ep-gap-1"><input type="radio" name="auth" value="PRIVATE_KEY_JWT" th:checked="${auth == 'PRIVATE_KEY_JWT'}"> By OAuth registration: this installation registers itself (RFC 7591) and signs its own tokens (private_key_jwt)</label>
            </div>
            <div class="form-group">
                <label class="ep-label" for="support-add-token">Token</label>
                <input class="ep-input" id="support-add-token" type="password" name="token" maxlength="4096" autocomplete="off">
                <span class="form-hint">Only with a token. A connection that registers is registered from its own page once added.</span>
            </div>
            <div class="form-group" role="group" aria-labelledby="support-add-services-label">
                <span class="ep-label" id="support-add-services-label">Services to use</span>
                <div class="ep-row ep-row-wrap ep-gap-4">
                    <label th:each="sv : ${serviceNames}" class="ep-row ep-gap-1"><input type="checkbox" name="services" th:value="${sv}"
                           th:checked="${(pre != null and #lists.contains(pre.services, sv)) or (addServices != null and #lists.contains(addServices, sv))}"> <span th:text="${sv}">requests</span></label>
                </div>
            </div>
            <input type="hidden" name="tenantIdentity" th:if="${pre != null and pre.tenantIdentity != null}" th:value="${pre.tenantIdentity.name()}">
            <input type="hidden" name="telemetry" th:if="${pre != null and pre.telemetry != null}" th:value="${pre.telemetry.name()}">
        </div>
        <div class="ep-dialog-footer">
            <button type="button" class="ep-btn ep-btn-ghost" data-close-dialog="add-connection-dialog">Cancel</button>
            <button type="submit" class="ep-btn ep-btn-primary" data-testid="support-connection-add-submit">Add connection</button>
        </div>
    </form>
</body>
</html>
