<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="content">
        <div th:replace="~{epistola-web/page-header :: page-header(
            pageTitle='Support requests',
            actions=~{::support-request-list-actions}
        )}"></div>

        <!-- Filters -->
        <div class="ep-filters ep-row ep-gap-3" style="margin-bottom: var(--ep-space-4);">
            <select class="ep-select ep-select-sm form-control-auto"
                    hx-get th:hx-get="@{/tenants/{tenantId}/support/requests/search(tenantId=${tenantId})}"
                    hx-target="#support-request-rows"
                    hx-swap="innerHTML"
                    hx-include="[name='category']"
                    name="status">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${#labels.of(s)}"
                        th:selected="${selectedStatus != null && selectedStatus.name() == s.name()}">STATUS</option>
            </select>
            <select class="ep-select ep-select-sm form-control-auto"
                    hx-get th:hx-get="@{/tenants/{tenantId}/support/requests/search(tenantId=${tenantId})}"
                    hx-target="#support-request-rows"
                    hx-swap="innerHTML"
                    hx-include="[name='status']"
                    name="category">
                <option value="">All categories</option>
                <option th:each="c : ${categories}" th:value="${c.name()}" th:text="${#labels.of(c)}"
                        th:selected="${selectedCategory != null && selectedCategory.name() == c.name()}">CATEGORY</option>
            </select>
        </div>

        <div th:if="${#lists.isEmpty(supportRequestItems)}" class="empty-state">
            <div class="empty-state-icon">
                <th:block th:replace="~{epistola-web/icon :: icon(name='message-square', class='ep-icon ep-icon-xl')}" />
            </div>
            <div class="empty-state-title">No support requests yet</div>
            <div class="empty-state-description">Send a support request to report a problem, ask a question or suggest something.</div>
        </div>

        <div th:if="${!#lists.isEmpty(supportRequestItems)}" class="ep-table-scroll" role="region" aria-label="Support requests" tabindex="0">
        <table class="ep-table">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Page</th>
                    <th>Category</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Submitted by</th>
                    <th>Comments</th>
                    <th>Created</th>
                </tr>
            </thead>
            <tbody id="support-request-rows">
                <th:block th:fragment="rows">
                    <tr th:each="item : ${supportRequestItems}">
                        <td>
                            <a th:href="@{/tenants/{tenantId}/support/requests/{id}(tenantId=${tenantId},id=${item.id})}"
                               style="font-weight: 500;"
                               th:text="${item.title}">Title</a>
                        </td>
                        <td>
                            <a th:if="${item.sourcePath != null}" th:href="${item.sourceUrl}"
                               class="text-muted text-sm" style="text-decoration: none;"
                               th:text="${item.sourcePath}">/path</a>
                            <span th:if="${item.sourcePath == null}" class="text-muted">—</span>
                        </td>
                        <td><th:block th:insert="~{support-requests/fragments/badges :: category-badge(${item.category})}" /></td>
                        <td><th:block th:insert="~{support-requests/fragments/badges :: status-badge(${item.status})}" /></td>
                        <td><th:block th:insert="~{support-requests/fragments/badges :: priority-badge(${item.priority})}" /></td>
                        <td th:text="${item.createdByName}">User</td>
                        <td th:text="${item.commentCount}">0</td>
                        <td th:text="${#temporals.format(item.createdAt, 'yyyy-MM-dd HH:mm')}" th:data-local-time="${item.createdAt}">2026-01-01</td>
                    </tr>
                </th:block>
            </tbody>
        </table>
        </div>

        <!-- Submit dialog (data-backdrop-close: feedback.js closes it on backdrop click) -->
        <dialog id="support-request-dialog" class="ep-dialog ep-dialog-wide" data-backdrop-close>
            <div id="support-request-dialog-content" class="support-request-dialog-content">
                <!-- Loaded via HTMX -->
            </div>
        </dialog>

        <script type="module" th:src="@{/support-requests/support-requests.js}"></script>
    </th:block>
    <th:block th:fragment="support-request-list-actions">
        <button type="button" class="ep-btn ep-btn-primary"
                hx-get th:hx-get="@{/tenants/{tenantId}/support/requests/submit-form(tenantId=${tenantId})}"
                hx-target="#support-request-dialog-content"
                hx-swap="innerHTML"
                data-open-dialog="support-request-dialog">
            <th:block th:replace="~{epistola-web/icon :: icon(name='plus', class='ep-icon')}" />
            New support request
        </button>
    </th:block>

</body>
</html>
