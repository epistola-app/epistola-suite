name: Epistola Chart Smoke Test

# The application chart gets an end-to-end Kind check only when its rendering
# or the test harness changes. Keep it separate from the generic chart lint so
# changes to other charts do not create a Kubernetes cluster unnecessarily.
on:
  pull_request:
    paths:
      - "charts/epistola/**"
      - "scripts/test-helm-chart.sh"
      - ".github/workflows/epistola-chart-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Install Epistola chart in Kind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up tools with mise
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5

      - name: Run chart smoke test
        run: scripts/test-helm-chart.sh
