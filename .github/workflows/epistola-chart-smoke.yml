name: Epistola Chart Smoke Test

# The application chart gets an end-to-end Kind check only when its rendering
# or the test harness changes. Keep it separate from the generic chart lint so
# changes to other charts do not create a Kubernetes cluster unnecessarily.
on:
  pull_request:
    paths:
      - "charts/epistola/**"
      - "scripts/test-helm-chart.sh"
      - ".github/workflows/epistola-chart-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Install Epistola chart in Kind
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the app's tags, to pick the image below

      - name: Set up tools with mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Run chart smoke test
        # The chart's appVersion is chosen ahead of its release (Chart.yaml), so on main it can name
        # an app version not released yet. Then the newest released image of the same major is
        # installed instead; the publish check still refuses an unreleased appVersion.
        run: |
          app_version="$(grep -E '^appVersion:' charts/epistola/Chart.yaml | head -n1 | awk '{print $2}' | tr -d '"')"
          if git rev-parse -q --verify "refs/tags/v${app_version}" >/dev/null; then
            scripts/test-helm-chart.sh
          else
            newest="$(git tag -l "v${app_version%%.*}.*" --sort=-v:refname | head -n1)"
            if [[ -z "${newest}" ]]; then
              echo "::error::appVersion ${app_version} is not released and no v${app_version%%.*}.* release exists"; exit 1
            fi
            echo "::notice::appVersion ${app_version} is not released yet; installing ${newest#v}"
            scripts/test-helm-chart.sh --image-tag "${newest#v}"
          fi
