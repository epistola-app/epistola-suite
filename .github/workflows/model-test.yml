name: Model Tests

# Random command sequences checked against invariants (`modelTest`, docs/testing.md). Too slow for
# every build, and each run searches somewhere new, so they run nightly instead. A failure prints
# the seed that replays it: `./gradlew :modules:epistola-core:modelTest -PmodelSeed=<seed>`.
on:
  schedule:
    - cron: "0 3 * * *" # Daily at 3 AM UTC
  workflow_dispatch:
    inputs:
      runs:
        description: "Sequences to run"
        default: "1000"
      seed:
        description: "Seed to replay (empty: a new search)"
        default: ""
  # A change to this workflow tests itself, on a short run.
  pull_request:
    branches: [main, "release/**"]
    paths: [".github/workflows/model-test.yml"]

permissions:
  contents: read

jobs:
  catalog-model:
    name: Catalog model test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # GitHub schedules only from the default branch, and the model test is on release/2.0
          # until 2.0 becomes main; then drop this line.
          ref: ${{ github.event_name == 'schedule' && 'release/2.0' || '' }}

      - name: Setup tools with mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          cache-read-only: true

      - name: Catalog model test
        env:
          RUNS: ${{ inputs.runs || (github.event_name == 'pull_request' && '100' || '1000') }}
          SEED: ${{ inputs.seed }}
        run: gradle :modules:epistola-core:modelTest -PmodelRuns="$RUNS" ${SEED:+-PmodelSeed="$SEED"}

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: model-test-reports
          path: "**/build/reports/tests/"
          retention-days: 14
          if-no-files-found: ignore
