name: Sync Project Configuration

on:
  push:
    branches:
      - main
    paths:
      - ".github/project.yml"
      - ".github/scripts/sync-project.mjs"
      - ".github/workflows/project-sync.yml"
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    name: Sync GitHub Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ secrets.PROJECT_APP_ID }}
          private-key: ${{ secrets.PROJECT_APP_PRIVATE_KEY }}
          owner: epistola-app

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install yaml

      - name: Sync project configuration
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/scripts/sync-project.mjs
