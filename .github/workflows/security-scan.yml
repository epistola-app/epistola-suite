name: Security Scan

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 6 AM UTC
  workflow_dispatch: # Manual trigger

jobs:
  scan:
    name: Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup tools with mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build frontend
        run: pnpm install && pnpm build

      - name: Generate backend SBOM
        run: gradle :apps:epistola:generateSbom

      - name: Generate frontend SBOM
        run: pnpm --filter @epistola/editor run sbom

      - name: Scan backend SBOM for vulnerabilities
        id: trivy-backend
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: "sbom"
          scan-ref: "apps/epistola/build/sbom/bom.json"
          format: "json"
          output: "backend-results.json"
          severity: "CRITICAL,HIGH"

      - name: Scan frontend SBOM for vulnerabilities
        id: trivy-frontend
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: "sbom"
          scan-ref: "modules/editor/build/sbom.json"
          format: "json"
          output: "frontend-results.json"
          severity: "CRITICAL,HIGH"

      - name: Scan backend SBOM (SARIF)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: "sbom"
          scan-ref: "apps/epistola/build/sbom/bom.json"
          format: "sarif"
          output: "backend-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Scan frontend SBOM (SARIF)
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        with:
          scan-type: "sbom"
          scan-ref: "modules/editor/build/sbom.json"
          format: "sarif"
          output: "frontend-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload backend SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: backend-results.sarif
          category: trivy-backend

      - name: Upload frontend SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: frontend-results.sarif
          category: trivy-frontend

      - name: Upload scan results as artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trivy-scan-results
          path: |
            backend-results.json
            frontend-results.json
            backend-results.sarif
            frontend-results.sarif
          retention-days: 30

      - name: Generate badge JSON
        id: badge
        run: |
          # Count vulnerabilities from both scans
          BACKEND_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' backend-results.json 2>/dev/null || echo 0)
          BACKEND_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' backend-results.json 2>/dev/null || echo 0)
          FRONTEND_CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' frontend-results.json 2>/dev/null || echo 0)
          FRONTEND_HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' frontend-results.json 2>/dev/null || echo 0)

          TOTAL_CRITICAL=$((BACKEND_CRITICAL + FRONTEND_CRITICAL))
          TOTAL_HIGH=$((BACKEND_HIGH + FRONTEND_HIGH))

          echo "critical=$TOTAL_CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$TOTAL_HIGH" >> $GITHUB_OUTPUT

          # Determine badge color and message
          if [ "$TOTAL_CRITICAL" -gt 0 ]; then
            COLOR="critical"
            MESSAGE="${TOTAL_CRITICAL} critical, ${TOTAL_HIGH} high"
          elif [ "$TOTAL_HIGH" -gt 0 ]; then
            COLOR="important"
            MESSAGE="${TOTAL_HIGH} high"
          else
            COLOR="success"
            MESSAGE="0 vulnerabilities"
          fi

          # Create shields.io endpoint JSON
          mkdir -p .github/badges
          cat > .github/badges/trivy.json << EOF
          {"schemaVersion":1,"label":"vulnerabilities","message":"${MESSAGE}","color":"${COLOR}"}
          EOF

          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "message=$MESSAGE" >> $GITHUB_OUTPUT

      - name: Commit badge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILE_PATH=".github/badges/trivy.json"

          # Get current file SHA if it exists (required for updates)
          CURRENT_SHA=$(gh api repos/${{ github.repository }}/contents/${FILE_PATH} --jq '.sha' 2>/dev/null || echo "")

          # Read new content and base64 encode it
          NEW_CONTENT=$(base64 -w0 ${FILE_PATH})

          # Check if content has changed by comparing with existing
          if [ -n "$CURRENT_SHA" ]; then
            EXISTING_CONTENT=$(gh api repos/${{ github.repository }}/contents/${FILE_PATH} --jq '.content' | tr -d '\n')
            if [ "$NEW_CONTENT" = "$EXISTING_CONTENT" ]; then
              echo "No changes to security badge"
              exit 0
            fi
          fi

          # Create or update the file via GitHub API (commits are automatically signed)
          if [ -n "$CURRENT_SHA" ]; then
            gh api repos/${{ github.repository }}/contents/${FILE_PATH} \
              --method PUT \
              -f message="chore: update security badge [skip ci]" \
              -f content="${NEW_CONTENT}" \
              -f branch="main" \
              -f sha="${CURRENT_SHA}"
          else
            gh api repos/${{ github.repository }}/contents/${FILE_PATH} \
              --method PUT \
              -f message="chore: update security badge [skip ci]" \
              -f content="${NEW_CONTENT}" \
              -f branch="main"
          fi

          echo "Security badge updated and committed (signed by GitHub)"

      - name: Create issue if critical vulnerabilities found
        if: steps.badge.outputs.critical > 0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const critical = ${{ steps.badge.outputs.critical }};
            const high = ${{ steps.badge.outputs.high }};

            // Check if an open issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security,vulnerability'
            });

            const existingIssue = issues.data.find(i => i.title.includes('Critical vulnerabilities detected'));

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `Critical vulnerabilities detected (${critical} critical, ${high} high)`,
                body: `The daily security scan has detected critical vulnerabilities.\n\n- **Critical**: ${critical}\n- **High**: ${high}\n\nPlease review the [latest security scan](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/security-scan.yml) for details.`,
                labels: ['security', 'vulnerability']
              });
            }

  # The `scan` job above covers the Java and npm SBOMs of `main`. These jobs cover
  # what customers run: the published images of every supported release line,
  # operating-system packages included. Trivy's database updates daily, so a CVE
  # disclosed today against something we shipped last month surfaces here
  # tomorrow. See docs/sbom.md#daily-cve-watch.
  release-images:
    name: Supported release images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: List supported release images
        id: list
        run: echo "images=$(python3 scripts/cve_watch.py supported-images --repository "$GITHUB_REPOSITORY")" >> "$GITHUB_OUTPUT"

  image-scan:
    name: Scan ${{ matrix.image }}
    needs: release-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.release-images.outputs.images) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Our own assessments: a finding recorded `not_affected` is not re-filed.
      - name: Generate VEX document
        run: python3 scripts/vulnerability_advisories.py export-vex build/vex

      - name: Scan image
        uses: aquasecurity/trivy-action@8f28faec26515256b6d22074d1d2a8986f4cbd87 # master
        env:
          TRIVY_VEX: build/vex/epistola.openvex.json
        with:
          scan-type: "image"
          image-ref: ${{ matrix.image }}
          format: "json"
          output: "trivy-image.json"
          severity: "CRITICAL,HIGH"

      - name: Name the report after the image
        id: report
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "name=trivy-image-$(echo "$IMAGE" | tr '/:' '__')" >> "$GITHUB_OUTPUT"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.report.outputs.name }}
          path: trivy-image.json
          retention-days: 30

  cve-triage:
    name: File new CVEs
    needs: image-scan
    # One image failing to scan must not hold back the findings of the others.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: trivy-image-*
          path: reports

      - name: Open an issue per new vulnerability
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cve_watch.py triage reports/*/trivy-image.json --repository "$GITHUB_REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
