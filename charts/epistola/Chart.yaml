apiVersion: v2
name: epistola
description: A Helm chart for deploying Epistola Document Suite
type: application
# Source of truth for the chart version. Dev carries the next version with
# -SNAPSHOT; a release strips it, tags epistola-<version>, then re-opens the next
# -SNAPSHOT (see the release-helm-chart skill). CI validates the tag == this value.
# 2.x deploys Epistola 2.x: a new app major is a chart major.
version: 2.0.0-SNAPSHOT
# The Epistola release this chart deploys by default, chosen in this file and never taken from the
# newest app tag; publishing checks that it is a released app version. The newest 2.0 pre-release
# until 2.0.0 is out, then 2.0.0 before this chart is released.
appVersion: "2.0.0-beta.1"
maintainers:
  - name: epistola-app
    url: https://github.com/epistola-app
home: https://github.com/epistola-app/epistola-suite
sources:
  - https://github.com/epistola-app/epistola-suite
keywords:
  - epistola
  - document-suite
  - spring-boot
  - kotlin
  - postgresql
  - cloudnativepg
