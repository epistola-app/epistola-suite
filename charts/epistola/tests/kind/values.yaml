config:
  # Self-contained form login on the default image, the one the chart installs by
  # default (appVersion). The demo profile needs the -demo image, which the default
  # image refuses (docs/auth.md, "Two images"); nothing here needs demo mode.
  # The chart still exercises its external database and migration Job wiring.
  profiles: localauth

# The smoke environment is disposable. Exercise the chart's production database
# wiring and migration hook without provisioning a test encryption keyset.
encryption:
  enabled: false

# Keep the disposable smoke environment small. It validates chart wiring and
# readiness, not document-generation throughput; use the chart defaults for
# the production generation profile documented in docs/deployment.md.
resources:
  limits:
    cpu: "1"
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 512Mi

database:
  type: external
  external:
    host: postgres
    port: 5432
    database: epistola
    username: epistola
    existingSecret: epistola-chart-test-db
    secretKey: password

migration:
  mode: job
