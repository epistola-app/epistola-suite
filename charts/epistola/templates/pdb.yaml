{{- if .Values.podDisruptionBudget.enabled }}
{{- $pdb := .Values.podDisruptionBudget }}
{{- $hasMin := not (kindIs "invalid" $pdb.minAvailable) }}
{{- $hasMax := and (not (kindIs "invalid" $pdb.maxUnavailable)) (ne (toString $pdb.maxUnavailable) "") }}
{{- if and $hasMin $hasMax }}
{{- fail "podDisruptionBudget: set either minAvailable or maxUnavailable, not both (set minAvailable to null to use maxUnavailable)." }}
{{- end }}
{{- if not (or $hasMin $hasMax) }}
{{- fail "podDisruptionBudget: set minAvailable or maxUnavailable." }}
{{- end }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "epistola.fullname" . }}
  labels:
    {{- include "epistola.labels" . | nindent 4 }}
spec:
  {{- if $hasMin }}
  minAvailable: {{ $pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ $pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "epistola.selectorLabels" . | nindent 6 }}
    {{- /* The migration Job's pods carry the selector labels as well. Counted here, a running
           migration pod passes for an app pod, and with maxUnavailable the controller cannot scale
           a Job and allows no eviction at all. Kubernetes sets the first label from 1.27 and the
           legacy one on every version. */}}
    matchExpressions:
      - { key: batch.kubernetes.io/job-name, operator: DoesNotExist }
      - { key: job-name, operator: DoesNotExist }
{{- end }}
