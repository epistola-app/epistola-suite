# Demo profile: loads demo tenant, themes, and templates.
# Does NOT affect authentication or database management.
#
# Combine with an environment/auth setup:
#   - demo            -> demo data; OIDC from env vars (Helm oidc.*)
#   - demo,localauth  -> demo data + form login; OIDC from env vars
#   - local,keycloak  -> local dev with a local Keycloak (demo comes with `local`)

epistola:
  demo:
    enabled: true
    # Optional. Set EPISTOLA_DEMO_SHAREDSECRET (>= 32 chars) to let the demo website call the
    # REST API as an all-tenant superuser: `Authorization: ApiKey <secret>` on any /api/**
    # endpoint. It bypasses the tenant and permission model entirely, which is why it works
    # under this profile and nowhere else — see docs/auth.md and docs/adr/0019.
  # Basis for the future training facility on epistola.app: allows Epistola's
  # UI to be embedded in an <iframe> there, driven by a postMessage bridge.
  # docs/embedding.md. Relaxes CSP frame-ancestors and switches session/CSRF
  # cookies to SameSite=None — demo-profile only, see ADR 0015.
  embedding:
    enabled: true
    allowed-parent-origins:
      - https://epistola.app
