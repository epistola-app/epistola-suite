services:
  postgres:
    # Exact versions with their digest, kept current by Renovate. 18.6 rather than 18.7: renovate.json waits
    # seven days before taking a release.
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    container_name: epistola-postgres
    environment:
      POSTGRES_DB: epistola
      POSTGRES_USER: epistola
      POSTGRES_PASSWORD: epistola
    ports:
      - "4001:5432"
    tmpfs:
      - /var/lib/postgresql:rw
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epistola"]
      interval: 5s
      timeout: 3s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4@sha256:0aae0de7fca85525f727d3354df17896092de8bb26ae4c12d89c77e5df8cbce4
    container_name: epistola-keycloak
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
    ports:
      - "4002:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro,z
    command:
      - start-dev
      - --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
