<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${templateName + ' - Edit - Epistola'}">Edit Template - Epistola</title>
    <th:block th:replace="~{fragments/styles :: styles}" />
    <th:block th:replace="~{fragments/embed-config :: island}" />
    <th:block th:replace="~{fragments/htmx :: htmx}" />
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <link rel="stylesheet" th:href="@{/editor/template-editor.css}">
    <style>
        .editor-page {
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .editor-container {
            flex: 1;
            overflow: hidden;
            width: 100%;
        }
        .editor-nav {
            height: 48px;
            border-bottom: 1px solid var(--ep-border-color);
            display: flex;
            align-items: center;
            padding: 0 var(--ep-space-4);
            background: var(--ep-white);
            flex-shrink: 0;
            gap: var(--ep-space-2);
            /* Establish a stacking context above the bubble menu (--ep-z-dropdown)
               so the nav occludes it when a selection scrolls up under the bar. */
            position: relative;
            z-index: var(--ep-z-sticky);
        }
        .editor-nav-back {
            display: flex;
            align-items: center;
            gap: var(--ep-space-2);
            text-decoration: none;
            color: var(--ep-foreground);
            font-weight: 600;
            font-size: var(--ep-text-sm);
        }
        .editor-nav-back:hover {
            color: var(--ep-primary);
            text-decoration: none;
        }
        .editor-nav-back .ep-icon {
            color: var(--ep-muted-foreground);
        }
        .editor-nav-back:hover .ep-icon {
            color: var(--ep-primary);
        }
        .editor-nav-variant {
            font-size: var(--ep-text-xs);
            color: var(--ep-muted-foreground);
            white-space: nowrap;
        }
        .editor-nav .ws-crumbs {
            flex: 1;
        }
        .editor-nav-right {
            margin-left: auto;
        }
    </style>
</head>
<body class="editor-page">
    <!--/* The context bar, slimmed to one line so the editor keeps the screen (docs/workspace-shell.md):
           where this is, which version it changes, what is not published yet, and Publish. Side work
           is marked as in the full bar. */-->
    <nav class="editor-nav" th:classappend="${editorScope.sideWork} ? 'ws-bar-side' : ''"
         th:with="scope=${editorScope}, bar=${editorScope.bar}">
        <a th:href="@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${templateId})}"
           class="editor-nav-back" data-testid="editor-back" th:title="'Back to ' + ${templateName}">
            <th:block th:replace="~{epistola-web/icon :: icon(name='arrow-left', class='ep-icon ep-icon-sm')}" />
        </a>
        <div class="ws-crumbs" role="navigation" aria-label="Where you are">
            <a class="ws-crumb" th:href="${scope.sections[0][0].href}" data-testid="editor-crumb-catalog" th:text="${scope.name}">Letters</a>
            <span class="ws-crumb-sep" aria-hidden="true">/</span>
            <span class="ws-crumb ws-crumb-version ws-crumb-here" th:classappend="${scope.sideWork} ? 'ws-crumb-side' : ''"
                  data-testid="editor-crumb-version" th:text="${scope.versionLabel}">Next release</span>
            <span class="ws-crumb-sep" aria-hidden="true">/</span>
            <a class="ws-crumb" th:href="@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${templateId})}"
               th:text="${templateName}">Template Name</a>
            <span class="editor-nav-variant" th:text="${variantId}"></span>
        </div>
        <div class="ws-bar-right editor-nav-right">
            <div th:if="${scope.statusHref != null}" class="ws-status" data-testid="ws-status"
                 th:hx-get="${scope.statusHref}" hx-trigger="load" hx-swap="innerHTML"></div>
        </div>
    </nav>
    <div id="release-dialog-container" data-open-dialog-on-swap="release-dialog"></div>
    <!-- data-leader-timing is a test-only seam (issue #418): present only when
         the ?leaderTiming= query param is supplied; omitted in production. -->
    <div id="editor-container" data-testid="editor-container" class="editor-container"
         th:attr="data-leader-timing=${leaderTiming}"></div>

    <!-- Module-contributed footer chrome (see FooterContributor / FooterFragmentResolver) -->
    <th:block th:each="frag : ${footerFragments}">
        <th:block th:replace="~{__${frag.ref}__}" />
    </th:block>

    <script type="application/json" id="editor-config" th:inline="javascript">
    {
        "editorModuleUrl": [[@{/editor/template-editor.js}]],
        "templateModel": [[${templateModel}]],
        "variantRevision": [[${variantRevision}]],
        "theme": [[${editorTheme}]],
        "availablePresets": [[${availablePresets}]],
        "templateId": [[${templateId}]],
        "tenantId": [[${tenantId}]],
        "catalogId": [[${catalogId}]],
        "catalogSegment": [[${catalogSegment}]],
        "variantId": [[${variantId}]],
        "dataExamples": [[${dataExamples}]],
        "dataModel": [[${dataModel}]],
        "locale": [[${resolvedLocale}]],
        "features": [[${editorFeatures}]],
        "plugins": [
            {
                "id": "ai",
                "feature": "aiChat",
                "moduleUrl": [[@{/editor/ai-plugin.js}]],
                "stylesheetUrl": [[@{/editor/ai-plugin.css}]],
                "factoryExport": "createEditorPlugin"
            },
            {
                "id": "quality",
                "feature": "quality",
                "factoryExport": "createQualityEditorPlugin",
                "config": {
                    "findingsUrl": [[@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}/variants/{variantId}/quality(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${templateId},variantId=${variantId})}]],
                    "checkUrl": [[@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}/variants/{variantId}/quality/check(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${templateId},variantId=${variantId})}]]
                }
            },
            {
                "id": "editor-walkthrough",
                "feature": "editorWalkthrough",
                "moduleUrl": [[@{/editor/walkthrough-plugin.js}]],
                "factoryExport": "createEditorPlugin"
            }
        ]
    }
    </script>
    <script type="module" th:src="@{/js/editor-boot.js}"></script>
</body>
</html>
