<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="content">
        <!--/* A template has one data contract, edited in place and released with its catalog: no
               draft to publish, no history to browse. */-->
        <div id="contract-status-bar" class="contract-status-bar">
            <strong>Data contract</strong>

            <!-- Editor-owned save state and actions are rendered here. -->
            <div th:if="${editMode && editable}" id="contract-save-controls" hx-preserve
                 class="contract-status-save-controls" role="region"
                 aria-label="Data contract save controls"></div>

            <th:block th:if="${editMode}">
                <a th:href="@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}/data-contract(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${template.id})}"
                   class="ep-btn ep-btn-outline ep-btn-sm" hx-boost="false">
                    Done editing
                </a>
            </th:block>

            <th:block th:if="${!editMode && editable && auth.has('TEMPLATE_EDIT')}">
                <a th:href="@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}/data-contract(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${template.id},edit=true)}"
                   class="ep-btn ep-btn-outline ep-btn-sm" hx-boost="false">
                    Edit
                </a>
            </th:block>

            <span class="contract-status-spacer"></span>
        </div>
    </th:block>
</body>
</html>
