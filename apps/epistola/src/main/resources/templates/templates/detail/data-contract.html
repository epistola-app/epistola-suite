<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="tab-content">
        <!-- Validation errors alert (rendered above the status bar so it's visible without scrolling) -->
        <div th:if="${editMode && editable}" id="contract-validation-alert" hx-preserve></div>

        <!-- Status bar (adapts to view/edit mode) -->
        <th:block th:replace="~{templates/detail/contract-status-bar :: content}" />

        <!-- ================================================================ -->
        <!-- VIEW MODE (default) -->
        <!-- ================================================================ -->
        <th:block th:if="${!editMode}">
            <div class="ep-panel detail-section">
                <div class="detail-section-header">
                    <h3 style="font-size: var(--ep-text-base); margin: 0;">Schema</h3>
                </div>
                <div class="detail-section-body">
                    <th:block th:if="${!#lists.isEmpty(schemaFields)}">
                        <table class="ep-table" style="font-size: var(--ep-text-sm); width: 100%;">
                            <thead><tr><th>Field</th><th>Type</th><th>Required</th><th>Description</th></tr></thead>
                            <tbody>
                                <tr th:each="field : ${schemaFields}">
                                    <td>
                                        <code th:style="'padding-left: ' + ${field.depth * 16} + 'px'" th:text="${field.name}"></code>
                                    </td>
                                    <td><span class="badge badge-outline" th:text="${field.type}"></span></td>
                                    <td>
                                        <span th:if="${field.required}" style="color: var(--ep-red-600);">Required</span>
                                        <span th:unless="${field.required}" class="text-muted">Optional</span>
                                    </td>
                                    <td class="text-muted" th:text="${field.description ?: ''}"></td>
                                </tr>
                            </tbody>
                        </table>
                    </th:block>
                    <th:block th:if="${#lists.isEmpty(schemaFields)}">
                        <p class="text-muted" style="text-align: center; padding: var(--ep-space-4);">
                            No schema defined yet.
                            <th:block th:if="${editable}">
                                Click <strong>Edit</strong> above to define one.
                            </th:block>
                        </p>
                    </th:block>
                </div>
            </div>

            <!-- Examples summary (names only, edit for full details) -->
            <th:block th:if="${contractDataExamples != null && !contractDataExamples.isEmpty()}">
                <div class="ep-panel detail-section">
                    <div class="detail-section-header">
                        <h3 style="font-size: var(--ep-text-base); margin: 0;">
                            Examples
                            <span class="text-muted" th:text="'(' + ${contractDataExamples.size()} + ')'"></span>
                        </h3>
                    </div>
                    <div class="detail-section-body" style="padding: var(--ep-space-3);">
                        <div class="ep-row ep-row-wrap">
                            <span th:each="example : ${contractDataExamples}"
                                  class="badge badge-outline" th:text="${example.name}"></span>
                        </div>
                    </div>
                </div>
            </th:block>
        </th:block>

        <!-- ================================================================ -->
        <!-- EDIT MODE -->
        <!-- ================================================================ -->
        <th:block th:if="${editMode}">
            <!-- data-contract-editor: template-detail.js mounts the editor on
                 htmx:load (idempotent via data-editor-mounted). -->
            <div id="data-contract-container" data-contract-editor
                 th:attr="data-tenant-id=${tenantId},data-catalog-id=${catalogId},data-template-id=${template.id},data-readonly=${!editable}"></div>
            <script id="data-contract-schema" type="application/json" th:inline="javascript">/*[[${contractDataModel}]]*/ null</script>
            <script id="data-contract-examples" type="application/json" th:inline="javascript">/*[[${contractDataExamples}]]*/ []</script>
        </th:block>
    </th:block>
</body>
</html>
