<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="tab-content">
        <!-- Details -->
        <div class="ep-panel detail-section">
            <div class="detail-section-header"><h3>Details</h3></div>
            <div class="detail-section-body">
                <dl class="description-list">
                    <dt>Name</dt>
                    <dd>
                        <!-- Committing the field (blur / Enter via keydown JS) fires the native
                             change event, which hx-patches the new name and swaps this input
                             back; the page <h1> is synced by an OOB fragment in the response.
                             A failed patch does not swap, so data-revert-on-error restores the
                             persisted name (behaviors.js). -->
                        <input type="text" id="template-name-input" class="ep-input" maxlength="100"
                               th:fragment="name-input"
                               name="name" th:value="${template.name}" th:disabled="${!editable}"
                               data-template-name-input data-revert-on-error
                               th:hx-patch="@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}/name(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${template.id})}"
                               hx-trigger="change" hx-swap="outerHTML"
                               style="max-width: 300px;">
                    </dd>
                    <dt><label for="template-description-input">Description</label></dt>
                    <dd>
                        <!-- Plain-text notes for authors, travelling with the template in its
                             catalog (wire v8). Committing the field (blur) fires change, which
                             hx-patches it and swaps the persisted value back; an emptied field
                             removes the description. -->
                        <textarea id="template-description-input" class="ep-textarea" maxlength="2000" rows="3"
                                  th:fragment="description-input"
                                  name="description" th:text="${template.description}" th:disabled="${!editable}"
                                  data-testid="template-description-input" data-revert-on-error
                                  placeholder="What this template is for, design decisions, known gaps. Not rendered."
                                  th:hx-patch="@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}/description(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${template.id})}"
                                  hx-trigger="change" hx-swap="outerHTML"
                                  style="max-width: 600px;"></textarea>
                    </dd>
                    <dt>ID</dt>
                    <dd><code th:text="${template.id}"></code></dd>
                    <dt>Catalog</dt>
                    <dd>
                        <code th:text="${catalogId}">default</code>
                        <!-- Moving is its own page; this opens the focused dialog for just this
                             template, so relocating one does not mean finding it there again. -->
                        <button th:if="${resourceRelocationEnabled and auth.has('CATALOG_MANAGE') and editable}"
                                type="button" class="ep-btn ep-btn-outline ep-btn-sm"
                                data-testid="template-move-action"
                                th:hx-get="@{/tenants/{tenantId}/catalogs/organise/move(tenantId=${tenantId},resource='template:' + ${catalogId} + '/' + ${template.id})}"
                                hx-target="#move-resource-mount" hx-swap="innerHTML"
                                style="margin-left: var(--ep-space-2);">
                            Move…
                        </button>
                    </dd>
                    <dt>Created</dt>
                    <dd th:text="${#temporals.format(template.createdAt, 'yyyy-MM-dd HH:mm')}" th:data-local-time="${template.createdAt}"></dd>
                    <dt>Modified</dt>
                    <dd th:text="${#temporals.format(template.updatedAt, 'yyyy-MM-dd HH:mm')}" th:data-local-time="${template.updatedAt}"></dd>
                </dl>
            </div>
        </div>

        <!-- Default Theme -->
        <div class="ep-panel detail-section" id="theme-section" th:fragment="theme-section">
            <div class="detail-section-header"><h3>Default Theme</h3></div>
            <div class="detail-section-body">
                <p class="text-muted" style="margin-bottom: var(--ep-space-4); font-size: var(--ep-text-sm);">
                    Set the default theme for all variants. Individual variants can override this in the editor.
                </p>
                <div class="form-row">
                    <div class="form-group" style="margin-bottom: 0;">
                        <select id="theme-select" name="themeId" class="ep-select"
                                th:disabled="${!editable}" data-revert-on-error
                                data-error-target="#theme-select-error" aria-describedby="theme-select-error"
                                th:hx-patch="@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}/theme(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${template.id})}"
                                hx-trigger="change" hx-target="#theme-section" hx-swap="outerHTML">
                            <option value="">No theme (use variant defaults)</option>
                            <th:block th:each="catalog : ${themeCatalogs}">
                                <optgroup th:label="${catalog.key}">
                                    <option th:each="theme : ${catalog.value}"
                                            th:value="${theme.catalogKey + '/' + theme.id}"
                                            th:text="${theme.name}"
                                            th:selected="${template.themeKey != null and template.themeKey == theme.id and (template.themeCatalogKey == null or template.themeCatalogKey == theme.catalogKey)}"></option>
                                </optgroup>
                            </th:block>
                        </select>
                        <div id="theme-select-error" class="alert alert-error control-error"
                             role="alert" hidden></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Output Settings -->
        <div class="ep-panel detail-section" id="output-settings-section" th:fragment="output-settings">
            <div class="detail-section-header"><h3>Output Settings</h3></div>
            <div class="detail-section-body">
                <label style="display: flex; align-items: flex-start; gap: var(--ep-space-3); cursor: pointer;">
                    <!-- Native HTMX: change hx-patches the checkbox state (an unchecked
                         checkbox submits nothing = disable) and the section re-renders
                         from the persisted value, so the UI always shows server truth.
                         A failed patch does not swap, so data-revert-on-error restores
                         the persisted state (behaviors.js). -->
                    <input type="checkbox" class="ep-checkbox" id="pdfa-toggle"
                           style="margin-top: 3px; width: auto; height: auto; flex-shrink: 0;"
                           name="pdfaEnabled" data-revert-on-error
                           th:checked="${template.pdfaEnabled}" th:disabled="${!editable}"
                           th:hx-patch="@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}/pdfa(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${template.id})}"
                           hx-trigger="change" hx-target="#output-settings-section" hx-swap="outerHTML">
                    <span>
                        <strong style="font-size: var(--ep-text-sm);">PDF/A-2b compliance</strong>
                        <span class="text-muted" style="display: block; font-size: var(--ep-text-sm); margin-top: 2px;">
                            Enable for long-term archival. Embeds fonts and ICC color profile, resulting in larger files.
                        </span>
                    </span>
                </label>
            </div>
        </div>

        <!-- Danger Zone -->
        <div th:if="${auth.has('TEMPLATE_EDIT') and editable}" class="ep-panel detail-section danger-zone">
            <div class="detail-section-header"><h3>Danger Zone</h3></div>
            <div class="detail-section-body">
                <p class="text-muted" style="margin-bottom: var(--ep-space-4); font-size: var(--ep-text-sm);">
                    Permanently delete this template and all its variants, versions, and data.
                </p>
                <form th:action="@{/tenants/{tenantId}/catalogs/{catalogId}/templates/{id}/delete(tenantId=${tenantId},catalogId=${catalogSegment ?: catalogId},id=${template.id})}"
                      method="post" id="delete-template-form" hx-boost="false">
                    <button type="button" class="ep-btn ep-btn-destructive ep-btn-sm" data-testid="delete-action"
                            data-confirm-submit
                            data-confirm-submit-title="Delete Template"
                            data-confirm-submit-message="Are you sure you want to delete this template? This action cannot be undone."
                            data-confirm-submit-label="Delete">Delete Template</button>
                </form>
            </div>
        </div>

        <!-- Behaviors (name edit keyboard UX, delete confirm) live in
             /js/pages/template-detail.js (ADR 0010: no inline scripts). -->
        <div id="move-resource-mount" data-dialog-mount></div>
    </th:block>

    <!-- OOB companion for the rename response: syncs the page header's title
         text via its dedicated swap anchor (only the title span — the sibling
         stage badge must survive the rename). innerHTML, not textContent:
         htmx's OOB swap has no textContent case and would fall through to the
         configured default swap style. -->
    <span th:fragment="page-title-oob"
          hx-swap-oob="innerHTML:#page-title-text"
          th:text="${template.name}"></span>
</body>
</html>
