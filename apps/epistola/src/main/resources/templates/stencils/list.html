<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="content">
        <div th:replace="~{epistola-web/page-header :: page-header(
            pageTitle='Stencils',
            searchPlaceholder='Search stencils...',
            searchUrl=@{/tenants/{tenantId}/stencils/search(tenantId=${tenantId})},
            searchTargetId='stencil-rows',
            searchableTotal=${#lists.size(stencils)},
            actions=~{::stencil-list-actions}
        )}"></div>

        <!--/* Filtered to a catalog with several drafts: which one the rows are from, and the others. */-->


        <div th:if="${#lists.isEmpty(stencils)}" class="empty-state">
            <div class="empty-state-icon">
                <th:block th:replace="~{epistola-web/icon :: icon(name='puzzle', class='ep-icon ep-icon-xl')}" />
            </div>
            <div class="empty-state-title">No stencils yet</div>
            <!--/* A catalog that cannot be changed here offers no create button, so its empty state does not invite one. */-->
                    <div class="empty-state-description" data-testid="empty-state-description"
                         th:text="${workspace?.catalog?.readOnly == true} ? 'This catalog is read-only here, so no stencils are added to it.' : 'Create a stencil to build reusable template components.'">Create a stencil to build reusable template components.</div>
            <button th:if="${auth.has('STENCIL_EDIT') and workspace?.catalog?.readOnly != true}" type="button"
                    class="ep-btn ep-btn-primary" style="margin-top: var(--ep-space-4);"
                    th:hx-get="@{/tenants/{tenantId}/catalogs/{catalogSeg}/stencils/new(tenantId=${tenantId},catalogSeg=${draftSegment.value})}"
                    hx-target="#dialog-mount" hx-swap="innerHTML" hx-push-url="true"
                    data-testid="stencil-create-open">
                <th:block th:replace="~{epistola-web/icon :: icon(name='plus', class='ep-icon')}" />
                New stencil
            </button>
        </div>

        <div th:if="${!#lists.isEmpty(stencils)}"
             class="ep-table-scroll" role="region" aria-label="Stencils table" tabindex="0"
             data-testid="fixed-table-scroll">
        <table class="ep-table ep-table-fixed">
            <colgroup>
                <col style="width: 20%" /><!-- Name -->
                <col style="width: 12%" /><!-- Catalog -->
                <col style="width: 20%" /><!-- Description -->
                <col style="width: 9%" /><!-- Tags -->
                <col style="width: 14%" /><!-- Last modified -->
                <col style="width: 25%" /><!-- Actions: labelled buttons (Rename or move…, Delete) on one line -->
            </colgroup>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Catalog</th>
                    <th>Description</th>
                    <th>Tags</th>
                    <th>Last modified</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="stencil-rows">
                <th:block th:fragment="rows">
                    <!--/* A search swaps only this fragment, so a "nothing found" message has to live
                           inside it: the empty state outside is never re-rendered, and the reader would
                           otherwise be left looking at an empty table that says nothing. */-->
                    <tr th:if="${#lists.isEmpty(stencils) and !#strings.isEmpty(searchTerm)}">
                        <td colspan="6" class="text-muted" style="text-align: center; padding: var(--ep-space-6);"
                            th:text="'No stencils match your search.'"></td>
                    </tr>
                    <tr th:each="stencil : ${stencils}">
                        <td th:title="${stencil.name}">
                            <a th:href="@{/tenants/{tenantId}/catalogs/{catalogId}/stencils/{stencilId}(tenantId=${tenantId},catalogId=${draftSegment?.linkFor(stencil.catalogId) ?: stencil.catalogId.address},stencilId=${stencil.id})}"
                               th:text="${stencil.name}" style="font-weight: 500;"></a>
                        </td>
                        <td th:title="${stencil.catalogKey}"><span class="badge badge-default" th:text="${stencil.catalogKey}"></span></td>
                        <td th:title="${stencil.description}">
                            <span th:if="${stencil.description != null}" th:text="${stencil.description}"></span>
                            <span th:unless="${stencil.description != null}" class="text-muted">-</span>
                        </td>
                        <td class="cell-wrap" th:title="${#strings.listJoin(stencil.tags, ', ')}">
                            <span th:each="tag : ${stencil.tags}" class="badge" th:text="${tag}" style="margin-right: var(--ep-space-1);"></span>
                        </td>
                        <td th:text="${#temporals.format(stencil.updatedAt, 'yyyy-MM-dd HH:mm')}" th:data-local-time="${stencil.updatedAt}" th:title="${#temporals.format(stencil.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="actions">
                            <th:block th:replace="~{fragments/refactoring :: row-action('stencil', ${draftSegment?.linkFor(stencil.catalogId) ?: stencil.catalogId.address}, ${stencil.id})}" />
                            <th:block th:if="${catalogEditing.editable(stencil.catalogKey)}">
                                <button th:if="${auth.has('STENCIL_EDIT')}"
                                        type="button"
                                        class="ep-btn ep-btn-outline ep-btn-destructive ep-btn-sm"
                                        data-confirm-title="Delete stencil"
                                        th:attr="data-confirm-message='Delete stencil &quot;' + ${stencil.name} + '&quot;? Templates using copies of this stencil are not affected.',data-confirm-url=@{/tenants/{tenantId}/catalogs/{catalogId}/stencils/{stencilId}/delete(tenantId=${tenantId},catalogId=${draftSegment?.linkFor(stencil.catalogId) ?: stencil.catalogId.address},stencilId=${stencil.id})}"
                                        data-confirm-target="#stencil-rows">Delete</button>
                            </th:block>
                        </td>
                    </tr>
                </th:block>
            </tbody>
        </table>
        </div>


        <!-- Dialog mount: the create dialog is swapped in here by the trigger
             (hx-get → #dialog-mount) and opened by static/js/behaviors.js. On
             direct navigation to /new the handler renders THIS page with
             openDialog=true, embedding the dialog as a plain <dialog> that the
             same JS opens on load.
             GOTCHA: the openDialog guard MUST wrap the th:replace on an OUTER
             element — th:replace (precedence 100) runs before th:if (300), so
             the two on the SAME element would include the dialog unconditionally.
             See docs/dialog-forms.md. -->
        <div th:replace="~{fragments/from-other-catalogs :: section(${fromOtherCatalogs}, 'stencils')}"></div>

        <div id="dialog-mount" data-dialog-mount>
            <th:block th:if="${openDialog}">
                <th:block th:replace="~{stencils/new :: dialog}"></th:block>
            </th:block>
        </div>
    </th:block>
    <th:block th:fragment="stencil-list-actions">
        <button th:if="${auth.has('STENCIL_EDIT') and workspace?.catalog?.readOnly != true}" type="button" class="ep-btn ep-btn-primary"
                th:hx-get="@{/tenants/{tenantId}/catalogs/{catalogSeg}/stencils/new(tenantId=${tenantId},catalogSeg=${draftSegment.value})}"
                hx-target="#dialog-mount" hx-swap="innerHTML" hx-push-url="true"
                data-testid="stencil-create-open-action">
            <th:block th:replace="~{epistola-web/icon :: icon(name='plus', class='ep-icon')}" />
            New stencil
        </button>
    </th:block>

</body>
</html>
