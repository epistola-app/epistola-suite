<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page not found - Epistola</title>
    <th:block th:replace="~{fragments/styles :: styles}" />
    <link rel="stylesheet" th:href="@{/css/shell.css}">
</head>
<body>
    <section th:fragment="content" class="not-found-page" aria-labelledby="not-found-title">
        <div class="not-found-code" aria-hidden="true">404</div>
        <div class="not-found-icon">
            <th:block th:replace="~{epistola-web/icon :: icon(name='search', class='ep-icon')}" />
        </div>
        <h1 id="not-found-title" th:text="${catalogSection != null} ? 'Not in this release' : 'Page not found'">Page not found</h1>
        <p th:if="${catalogSection != null}" data-testid="not-found-in-version">
            This release of the catalog doesn’t have it. It may be in another release, or have been deleted.
        </p>
        <p th:unless="${catalogSection != null}">
            The page you’re looking for doesn’t exist, may have moved, or is no longer available.
        </p>
        <div th:if="${catalogSection != null}" class="not-found-actions">
            <a th:href="@{${catalogSection.href}}" class="ep-btn ep-btn-primary"
               th:text="${catalogSection.label} + ' in this release'">Templates in this release</a>
            <a th:href="@{${catalogSection.overviewHref}}" class="ep-btn ep-btn-outline">Catalog overview</a>
        </div>
        <div th:unless="${catalogSection != null}" class="not-found-actions">
            <a th:if="${tenantId != null}"
               th:href="@{/tenants/{id}(id=${tenantId})}"
               class="ep-btn ep-btn-primary">Go to tenant home</a>
            <a th:unless="${tenantId != null}"
               th:href="@{/}"
               class="ep-btn ep-btn-primary">View tenants</a>
            <a th:if="${tenantId != null}"
               th:href="@{/}"
               class="ep-btn ep-btn-outline">View all tenants</a>
        </div>
    </section>
</body>
</html>
