<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <th:block th:fragment="footer">
        <!--/* Product/installation chrome only: identity and account actions live in the header's
               account menu. Module chrome arrives through FooterContributor below. The pipes sit
               inside the two groups, so a wrapped footer never starts or ends a line with one. */-->
        <footer class="app-footer">
            <span class="app-footer-product">
                <span class="app-footer-brand"><span th:text="${appName} ?: 'Epistola'">Epistola</span> <span class="version" th:text="'v' + (${appVersion} ?: 'dev')">v0.0.0</span></span>
                <span class="app-footer-separator" aria-hidden="true">|</span>
                <a th:href="@{/api-docs}" target="_blank" rel="noopener">API Docs</a>
                <span class="app-footer-separator" aria-hidden="true">|</span>
                <button type="button"
                        class="link-button"
                        id="changelog-button"
                        aria-haspopup="dialog"
                        aria-controls="changelog-dialog"
                        data-open-dialog="changelog-dialog"
                        th:hx-get="@{/changelog}"
                        hx-target="#changelog-dialog-content"
                        hx-swap="innerHTML"
                        hx-trigger="click once">
                    Changelog
                </button>
            </span>
            <!-- Installation-wide status (see FooterStatusContributor), e.g. the support badge. -->
            <th:block sec:authorize="isAuthenticated()">
                <span class="app-footer-status" th:if="${!#lists.isEmpty(footerStatusFragments)}">
                    <th:block th:each="frag : ${footerStatusFragments}">
                        <span class="app-footer-separator" aria-hidden="true">|</span>
                        <th:block th:replace="~{__${frag.ref}__}" />
                    </th:block>
                </span>
            </th:block>
        </footer>

        <dialog id="changelog-dialog" class="ep-dialog ep-dialog-wide" aria-labelledby="changelog-title">
            <div id="changelog-dialog-content">
                <p class="changelog-loading">Loading changelog...</p>
            </div>
        </dialog>

        <!-- Session expiry dialogs (only for authenticated users) -->
        <th:block sec:authorize="isAuthenticated()">
            <th:block th:replace="~{fragments/session-dialogs :: session-dialogs}" />
            <script type="module" th:src="@{/js/modules/session-monitor-boot.js}"></script>
        </th:block>

        <!-- Module-contributed footer chrome (see FooterContributor / FooterFragmentResolver) -->
        <th:block sec:authorize="isAuthenticated()">
            <th:block th:each="frag : ${footerFragments}">
                <th:block th:replace="~{__${frag.ref}__}" />
            </th:block>
        </th:block>
    </th:block>
</body>
</html>
