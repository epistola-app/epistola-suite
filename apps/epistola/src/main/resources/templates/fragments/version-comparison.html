<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
        Reusable version comparison dialog.
        Include once per page; the trigger is plain HTMX plus the app-wide
        data-open-dialog hook (behaviors.js). Running the compare itself stays a
        delegated hook in /js/pages/template-detail.js (ADR 0010: no inline scripts).

        Usage:
            1. Include the dialog:
                <th:block th:replace="~{fragments/version-comparison :: version-comparison}" />

            2. Add a compare button (hx-get loads the comparison UI, the hook opens the dialog):
                <button type="button"
                        th:hx-get="@{/tenants/{t}/templates/{id}/variants/{v}/compare(t=${tenantId},id=${templateId},v=${variantId})}"
                        hx-target="#version-comparison-dialog-body" hx-swap="innerHTML"
                        data-open-dialog="version-comparison-dialog">
                    Compare
                </button>
    -->
    <th:block th:fragment="version-comparison">
        <dialog id="version-comparison-dialog" class="ep-dialog ep-dialog-fullscreen">
            <div id="version-comparison-dialog-body">
                <!-- Content loaded via HTMX -->
            </div>
        </dialog>
    </th:block>
</body>
</html>
