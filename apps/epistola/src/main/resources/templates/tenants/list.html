<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/*
    Platform home: the tenants of this installation, with "Site banner" and "Shared with Epistola".
    Rendered as the content of layout/shell (no workspace), so the platform crumb and the account
    menu come from the bar. Model: `tenants`, `auth`, `defaultAuthority`, `openDialog`; `tenant-list`
    and `rows` are the HTMX swap fragments, tenants/new the create dialog.
    */-->
    <div th:fragment="content">
        <!--/* The list first, creating in a dialog (docs/dialog-forms.md), as every other list does. */-->
        <div th:replace="~{epistola-web/page-header :: page-header(
            pageTitle='Tenants',
            searchPlaceholder='Search tenants...',
            searchUrl='/tenants/search',
            searchTargetId='tenant-rows',
            searchableTotal=${#lists.size(tenants)},
            actions=~{::tenant-list-actions}
        )}"></div>

        <!--/* One OOB-swappable region (dialogSuccess refreshes it); search and delete keep swapping
               just the rows inside it. Uses `auth`, which HtmxFragmentModelContributor injects on the
               OOB render path. */-->
        <div id="tenant-list" th:fragment="tenant-list" th:attr="hx-swap-oob=${oob} ? 'outerHTML' : null">
            <div class="ep-table-scroll" role="region" aria-label="Tenants table" tabindex="0"
                 data-testid="fixed-table-scroll">
            <table class="ep-table ep-table-fixed">
                <colgroup>
                    <col style="width: 25%" /><!-- ID -->
                    <col style="width: 33%" /><!-- Name -->
                    <col style="width: 17%" /><!-- Created -->
                    <col style="width: 25%" /><!-- Actions: labelled, so wider than an icon column -->
                </colgroup>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tenant-rows">
                    <!--/* Fragment contains only the rows, not the tbody wrapper */-->
                    <th:block th:fragment="rows">
                        <tr th:each="tenant : ${tenants}">
                            <td th:text="${tenant.id}" th:title="${tenant.id}"></td>
                            <td th:title="${tenant.name}">
                                <a th:href="@{/tenants/{id}(id=${tenant.id})}" th:text="${tenant.name}"></a>
                            </td>
                            <td th:text="${#temporals.format(tenant.createdAt, 'yyyy-MM-dd HH:mm')}" th:data-local-time="${tenant.createdAt}" th:title="${#temporals.format(tenant.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                            <!--/* Labelled actions: an icon alone (tag, trash) said nothing at a glance and
                                   nothing at all on touch. The name already opens the tenant. */-->
                            <td class="actions">
                                <a th:if="${auth.has('TENANT_MANAGER')}" th:href="@{/platform/tenants/{id}/namespaces(id=${tenant.id})}"
                                   class="ep-btn ep-btn-outline ep-btn-sm" data-testid="tenant-namespaces-link">
                                    <th:block th:replace="~{epistola-web/icon :: icon(name='tag', class='ep-icon ep-icon-sm')}" />
                                    Namespaces
                                </a>
                                <button th:if="${auth.has('TENANT_MANAGER')}"
                                        type="button"
                                        class="ep-btn ep-btn-outline ep-btn-destructive ep-btn-sm"
                                        data-testid="tenant-delete"
                                        data-confirm-title="Delete tenant"
                                        th:attr="data-confirm-message='Permanently delete tenant &quot;' + ${tenant.name} + '&quot; (' + ${tenant.id} + ')? This will delete all associated data including templates, themes, environments, assets, and memberships. This action cannot be undone.',data-confirm-url=@{/tenants/{tenantId}/delete(tenantId=${tenant.id})}"
                                        data-confirm-target="#tenant-rows">
                                    <th:block th:replace="~{epistola-web/icon :: icon(name='trash-2', class='ep-icon ep-icon-sm')}" />
                                    Delete
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(tenants)}">
                            <td colspan="4" class="empty-message"
                                th:text="${auth.has('TENANT_MANAGER')} ? 'No tenants yet. Create one with New tenant.' : 'No tenants available.'"></td>
                        </tr>
                    </th:block>
                </tbody>
            </table>
            </div>
        </div>

        <!--/* The create dialog lands here: swapped in by New tenant, or embedded on direct navigation
               to /tenants/new (openDialog). The guard wraps the replace on an outer element. */-->
        <div id="dialog-mount" data-dialog-mount>
            <th:block th:if="${openDialog}">
                <th:block th:replace="~{tenants/new :: dialog}"></th:block>
            </th:block>
        </div>
    </div>

    <th:block th:fragment="tenant-list-actions">
        <th:block th:if="${auth.has('TENANT_MANAGER')}">
            <a th:href="@{/platform/banner}" class="ep-btn ep-btn-outline" data-testid="platform-banner-link">Site banner</a>
            <a th:href="@{/platform/sharing}" class="ep-btn ep-btn-outline" data-testid="platform-sharing-link">Shared with Epistola</a>
            <button type="button" class="ep-btn ep-btn-primary"
                    th:hx-get="@{/tenants/new}" hx-target="#dialog-mount" hx-swap="innerHTML" hx-push-url="true"
                    data-testid="tenant-create-open">
                <th:block th:replace="~{epistola-web/icon :: icon(name='plus', class='ep-icon')}" />
                New tenant
            </button>
        </th:block>
    </th:block>
</body>
</html>
