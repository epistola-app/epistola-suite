<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
    The create-tenant dialog (docs/dialog-forms.md). Rendered two ways off TenantHandler:
      - `dialog` — swapped into #dialog-mount by the page header's New tenant (hx-get), and
        embedded in the tenants page's #dialog-mount on direct navigation (openDialog=true).
      - `tenant-form` — re-rendered on field errors (dialogFieldErrors retargets
        #create-tenant-form), so the form swaps in place with inline errors and kept values.

    Model it needs: `defaultAuthority`, and on error re-render `formData`/`errors`.
    -->
    <th:block th:fragment="dialog">
        <div th:replace="~{epistola-web/dialog :: dialog-shell(
            dialogId='create-tenant-dialog',
            title='New tenant',
            closeUrl=@{/},
            content=~{::tenant-form})}"></div>
    </th:block>

    <form th:fragment="tenant-form" id="create-tenant-form"
          method="post" th:action="@{/tenants}"
          th:hx-post="@{/tenants}"
          hx-target="#tenant-list" hx-swap="outerHTML">
        <div th:replace="~{epistola-web/form-error :: form-error(id='create-tenant-error')}"></div>
        <div class="ep-dialog-body">
            <div class="form-group" th:classappend="${errors?.containsKey('name')} ? 'error' : ''">
                <label class="ep-label" for="name">Name</label>
                <input type="text" id="name" name="name" class="ep-input" required maxlength="100"
                       data-slug-source="slug"
                       th:value="${formData?.name}">
                <span class="form-error" th:if="${errors?.containsKey('name')}" th:text="${errors.name}"></span>
            </div>
            <div class="form-group" th:classappend="${errors?.containsKey('slug')} ? 'error' : ''">
                <label class="ep-label" for="slug">Tenant ID</label>
                <input type="text" id="slug" name="slug" class="ep-input" required placeholder="my-company"
                       pattern="^[a-z][a-z0-9]*(-[a-z0-9]+)*$" minlength="3" maxlength="63"
                       th:value="${formData?.slug}">
                <span class="form-hint">3-63 characters, lowercase letters, numbers, and hyphens only.</span>
                <span class="form-error" th:if="${errors?.containsKey('slug')}" th:text="${errors.slug}"></span>
            </div>
            <div class="form-group" th:classappend="${errors?.containsKey('namespace')} ? 'error' : ''">
                <label class="ep-label" for="namespace">Namespace</label>
                <input type="text" id="namespace" name="namespace" class="ep-input" required placeholder="acme"
                       pattern="^[a-z][a-z0-9]*(-[a-z0-9]+)*$" minlength="3" maxlength="63"
                       data-testid="tenant-namespace"
                       th:value="${formData?.get('namespace')}">
                <span class="form-hint">The namespace its catalogs are named in, granted to it now; more can be granted under Namespaces.</span>
                <span class="form-error" th:if="${errors?.containsKey('namespace')}" th:text="${errors.namespace}"></span>
            </div>
            <div class="form-group" th:classappend="${errors?.containsKey('authority')} ? 'error' : ''">
                <label class="ep-label" for="authority">Authority</label>
                <input type="text" id="authority" name="authority" class="ep-input" required maxlength="253"
                       data-testid="tenant-authority"
                       th:value="${formData?.get('authority') ?: defaultAuthority}">
                <span class="form-hint">The domain the namespace is granted under: the organisation's own, such as gemeente-x.nl, or exchange.epistola.app.</span>
                <span class="form-error" th:if="${errors?.containsKey('authority')}" th:text="${errors.authority}"></span>
            </div>
        </div>
        <div class="ep-dialog-footer">
            <button type="button" class="ep-btn ep-btn-ghost"
                    data-close-dialog="create-tenant-dialog">Cancel</button>
            <button type="submit" class="ep-btn ep-btn-primary" data-testid="create-form-submit">Create tenant</button>
        </div>
    </form>
</body>
</html>
