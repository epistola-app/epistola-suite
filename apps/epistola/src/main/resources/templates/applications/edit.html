<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--
    The edit-application dialog (name and description), rendered off ApplicationHandler:
      - `dialog` — swapped into #dialog-mount by the trigger, or embedded in the application page for
        direct navigation (openDialog='applications/edit').
      - `edit-form` — re-rendered in place on field errors (dialogFieldErrors).
    On success the browser reloads the application's page.

    Model: `tenantId`, `app`; on error `formData`/`errors`.
    -->
    <th:block th:fragment="dialog">
        <div th:replace="~{epistola-web/dialog :: dialog-shell(
            dialogId='edit-application-dialog',
            title='Edit application',
            closeUrl=@{/tenants/{t}/applications/{a}(t=${tenantId},a=${app.id})},
            content=~{::edit-form})}"></div>
    </th:block>

    <form th:fragment="edit-form" id="edit-application-form"
          method="post" th:action="@{/tenants/{t}/applications/{a}/edit(t=${tenantId},a=${app.id})}"
          th:hx-post="@{/tenants/{t}/applications/{a}/edit(t=${tenantId},a=${app.id})}"
          hx-target="#edit-application-form" hx-swap="outerHTML">
        <div th:replace="~{epistola-web/form-error :: form-error(id='edit-application-error')}"></div>
        <div class="ep-dialog-body">
            <div class="form-group" th:classappend="${errors?.containsKey('name')} ? 'error' : ''">
                <label class="ep-label" for="edit-name">Name</label>
                <input type="text" id="edit-name" name="name" class="ep-input"
                       required maxlength="100"
                       th:value="${formData != null ? formData.name : app.name}"
                       autofocus>
                <span class="form-hint">Max 100 characters. Renaming changes no key and no document.</span>
                <span class="form-error" th:if="${errors?.containsKey('name')}" th:text="${errors.name}"></span>
            </div>
            <div class="form-group" th:classappend="${errors?.containsKey('description')} ? 'error' : ''">
                <label class="ep-label" for="edit-description">Description (optional)</label>
                <input type="text" id="edit-description" name="description" class="ep-input"
                       maxlength="500"
                       th:value="${formData != null ? formData.description : app.description}">
                <span class="form-error" th:if="${errors?.containsKey('description')}" th:text="${errors.description}"></span>
            </div>
        </div>
        <div class="ep-dialog-footer">
            <button type="button" class="ep-btn ep-btn-ghost"
                    data-close-dialog="edit-application-dialog">Cancel</button>
            <button type="submit" class="ep-btn ep-btn-primary" data-testid="edit-form-submit">Save</button>
        </div>
    </form>
</body>
</html>
