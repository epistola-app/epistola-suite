<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <div th:replace="~{epistola-web/page-header :: page-header(pageTitle='Resource graph')}"></div>
    <p class="ep-text-muted" style="margin-top: 0; margin-bottom: var(--ep-space-4);">
        Explore which catalog resources use each other. Arrows point from a resource to the resource it uses.
    </p>
    <ep-resource-graph th:attr="data-base-url=@{/tenants/{tenantId}/resource-graph(tenantId=${tenantId})}">
        <div class="ep-panel" style="padding: var(--ep-space-6);">Loading resource graph…</div>
    </ep-resource-graph>
</th:block>
</body>
</html>
