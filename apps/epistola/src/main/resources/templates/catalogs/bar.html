<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/* Which catalog a resource belongs to, and where that catalog stands.

           Meant for every page that edits a catalog resource — templates, stencils, themes, code
           lists, fonts, images, attributes — so the answer to "which catalog am I changing, and is
           my work released" is in the same place and the same words everywhere.

           Kept separate from the page header on purpose. The header is about the resource; this is
           about the catalog it lives in. Merging them reads as though the resource had a version of
           its own, which is exactly the confusion the release model removes: editing happens in the
           working copy, and only a catalog has versions.

           Usage, from any resource page:
             <div th:replace="~{catalogs/bar :: catalog-bar(context=${catalogContext})}"></div>
           and, once, for the release dialog to land in:
             <div th:replace="~{catalogs/bar :: catalog-bar-dialog}"></div>
    */-->
    <div th:fragment="catalog-bar" th:if="${context != null}" class="catalog-bar">
        <div class="catalog-bar-context">
            <span class="catalog-bar-label">Catalog</span>
            <a class="catalog-bar-name"
               th:href="@{/tenants/{tenantId}/catalogs/{catalogId}/browse(tenantId=${tenantId},catalogId=${context.catalogKey})}"
               th:text="${context.name}">Catalog name</a>

            <span class="catalog-bar-state" th:text="${context.summary}">Authored catalog · last released v1.0.0</span>

            <!--/* Stated, not warned: unreleased work is the normal state of a catalog being
                   authored, not a problem to fix. */-->
            <span th:if="${context.pendingChanges}" class="badge badge-outline">unreleased changes</span>
        </div>

        <!--/* Releasing is catalog-wide — this resource goes out with everything else that changed
               — so the label says catalog rather than implying this page can be released alone.
               Offered only where there is something to release, and to someone who may. */-->
        <button th:if="${context.releasable and auth.has('TEMPLATE_PUBLISH')}"
                type="button" class="ep-btn ep-btn-outline ep-btn-sm"
                th:hx-get="@{/tenants/{tenantId}/catalogs/{catalogId}/release(tenantId=${tenantId},catalogId=${context.catalogKey})}"
                hx-target="#release-dialog-container" hx-swap="innerHTML">Release catalog</button>
    </div>

    <!--/* The release dialog lands here and is opened on swap by the app-wide behaviour. */-->
    <div th:fragment="catalog-bar-dialog" id="release-dialog-container" data-open-dialog-on-swap="release-dialog"></div>
</body>
</html>
