<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/* Drafts of an authored catalog (contract ADR 0002). Which draft a page works in is shown
           by the workspace bar (layout/nav), built from CatalogDraftBar. */-->

    <!--/* Open a draft. The number is free text, the source a choice among the catalog's drafts and
           the releases that kept their content; without one, the draft copies its base (the highest
           release below its number), as the contract defaults.
           Model: `tenantId`, `catalogId`, `bar`, and on re-render `formData`/`errors`. */-->
    <th:block th:fragment="create-dialog">
        <div th:replace="~{epistola-web/dialog :: dialog-shell(
            dialogId='create-draft-dialog',
            title='New draft',
            closeUrl=@{/tenants/{tenantId}/catalogs/{catalogId}/browse(tenantId=${tenantId},catalogId=${bar.segmentValue})},
            content=~{::create-form})}"></div>
    </th:block>

    <form th:fragment="create-form" id="create-draft-form"
          th:hx-post="@{/tenants/{tenantId}/catalogs/{catalogId}/drafts(tenantId=${tenantId},catalogId=${bar.segmentValue})}"
          hx-target="#create-draft-form" hx-swap="outerHTML">
        <div th:replace="~{epistola-web/form-error :: form-error(id='create-draft-error')}"></div>
        <div class="ep-dialog-body">
            <p class="form-hint">
                A draft is its own copy of the catalog's content, edited and released on its own: a
                maintenance line next to the next major, for example.
            </p>
            <div class="form-group" th:classappend="${errors?.containsKey('version')} ? 'error' : ''">
                <label class="ep-label" for="create-draft-version">Version</label>
                <input type="text" id="create-draft-version" name="version" class="ep-input" required maxlength="50"
                       pattern="^\d+\.\d+\.\d+$" th:value="${formData?.get('version') ?: bar.suggestedNewVersion}">
                <span class="form-hint">Semantic version: MAJOR.MINOR.PATCH. Unique among the catalog's drafts and releases.</span>
                <span class="form-error" th:if="${errors?.containsKey('version')}" th:text="${errors.version}"
                      data-testid="create-draft-error"></span>
            </div>
            <div class="form-group" th:classappend="${errors?.containsKey('from')} ? 'error' : ''">
                <label class="ep-label" for="create-draft-from">Copy</label>
                <select id="create-draft-from" name="from" class="ep-select" data-testid="create-draft-from">
                    <option value="">Its base: the highest release below its number</option>
                    <option th:each="option : ${bar.createFromOptions}" th:value="${option}" th:text="'v' + ${option}"
                            th:selected="${formData != null and option == formData.get('from')}">v1.0.0</option>
                </select>
                <span class="form-error" th:if="${errors?.containsKey('from')}" th:text="${errors.from}"></span>
            </div>
        </div>
        <div class="ep-dialog-footer">
            <button type="button" class="ep-btn ep-btn-ghost" data-close-dialog="create-draft-dialog">Cancel</button>
            <button type="submit" class="ep-btn ep-btn-primary" data-testid="create-draft-submit">Open draft</button>
        </div>
    </form>
</body>
</html>
