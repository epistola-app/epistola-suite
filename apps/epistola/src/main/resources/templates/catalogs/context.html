<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/* Which catalog you are working in, shown wherever a catalog resource is edited.

           A resource page is a view onto one catalog's working copy, and saying so is the point:
           the version named here is what the catalog was last released at, never what you are
           editing. Editing happens in the working copy, which has no version until it is released
           -- which is also why the action offered is Release rather than Save. */-->
    <div th:fragment="catalog-context" class="ep-panel" style="margin-bottom: var(--ep-space-4);">
        <div class="ep-row" style="justify-content: space-between; align-items: center; gap: var(--ep-space-2);">
            <div class="ep-row" style="gap: var(--ep-space-2); align-items: baseline; flex-wrap: wrap;">
                <span class="text-muted text-sm">Catalog</span>
                <a th:href="@{/tenants/{tenantId}/catalogs/{catalogId}/browse(tenantId=${tenantId},catalogId=${context.catalogKey})}"
                   style="font-weight: 500;" th:text="${context.name}">Catalog name</a>
                <span th:if="${context.authored}" class="badge badge-info">Authored</span>
                <span th:unless="${context.authored}" class="badge badge-default">Subscribed</span>

                <span th:if="${context.releasedVersion != null}" class="text-muted text-sm"
                      th:text="'Last released v' + ${context.releasedVersion}">Last released v1.0.0</span>
                <span th:if="${context.releasedVersion == null and context.authored}" class="text-muted text-sm">Never released</span>

                <!--/* Said plainly rather than as a warning: unreleased work is the normal state of
                       a catalog being authored, not a problem to fix. */-->
                <span th:if="${context.pendingChanges}" class="badge badge-outline">unreleased changes</span>
            </div>

            <!--/* Releasing is a catalog-wide act, so this opens the catalog's own release dialog
                   rather than implying this resource can be released on its own. Withheld where
                   there is nothing to release, and from anyone who may not. */-->
            <button th:if="${context.releasable and auth.has('TEMPLATE_PUBLISH')}"
                    type="button" class="ep-btn ep-btn-outline ep-btn-sm"
                    th:hx-get="@{/tenants/{tenantId}/catalogs/{catalogId}/release(tenantId=${tenantId},catalogId=${context.catalogKey})}"
                    hx-target="#release-dialog-container" hx-swap="innerHTML">Release catalog</button>
        </div>
    </div>

    <!--/* The dialog lands here, opened on swap by the app-wide behaviour. */-->
    <div th:fragment="catalog-context-dialog" id="release-dialog-container" data-open-dialog-on-swap="release-dialog"></div>
</body>
</html>
