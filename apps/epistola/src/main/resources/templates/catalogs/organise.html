<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="content">
    <div th:replace="~{epistola-web/page-header :: page-header(pageTitle='Organise catalogs')}"></div>
    <p class="ep-text-muted" style="margin-top: 0; margin-bottom: var(--ep-space-4);">
        Browse resources across catalogs and move them. A move is previewed before it is applied, and the
        whole selection moves together or not at all.
    </p>
    <ep-catalog-organise
            th:attr="data-base-url=@{/tenants/{tenantId}/catalogs/organise(tenantId=${tenantId})},data-preselected=${preselected}">
        <div class="ep-panel" style="padding: var(--ep-space-6);">Loading catalogs…</div>
    </ep-catalog-organise>
</th:block>
</body>
</html>
