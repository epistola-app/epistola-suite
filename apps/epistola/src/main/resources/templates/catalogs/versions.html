<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/* A catalog's versions (docs/workspace-shell.md): the next version and any side work, then the
           published versions, each to its own page. Model: the catalog page's. */-->
    <th:block th:fragment="content">
        <div th:replace="~{epistola-web/page-header :: page-header(
            pageTitle='Versions',
            pageDescription='Published versions never change. To change one, fix it: that is published as its next patch.'
        )}"></div>
        <div id="catalog-alert"></div>
        <div th:if="${publicationError != null}" class="alert alert-error" data-testid="catalog-versions-error" th:text="${publicationError}"></div>
        <div th:if="${nextReleaseError != null}" class="alert alert-error" data-testid="catalog-next-release-error">
            <span th:text="${nextReleaseError}"></span>
        </div>
        <div th:replace="~{catalogs/overview :: versions}"></div>
        <div id="dialog-mount" data-dialog-mount></div>
    </th:block>
</body>
</html>
