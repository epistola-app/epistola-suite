<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/* The context bar's status (docs/workspace-shell.md), loaded into the bar after the page: what
           the version the page works in has not published yet, and Publish; or, with nothing in
           progress, the way to start. Model: `tenantId`, `bar` (CatalogDraftBar) and `readiness`
           (CatalogReleaseReadiness, null without a draft). Every control gates on one name. */-->
    <th:block th:fragment="bar-status"
              th:with="overview=${bar.fixing} ? ${bar.draftPageHref} : @{/tenants/{t}/catalogs/{c}/browse(t=${tenantId},c=${bar.catalogKey})}">
        <th:block th:if="${readiness == null}">
            <span class="ws-status-text" data-testid="catalog-draft-none">Nothing in progress</span>
            <form th:if="${bar.offerOpenDraft}" method="post" class="ws-status-form"
                  th:action="@{/tenants/{t}/catalogs/{c}/drafts(t=${tenantId},c=${bar.catalogKey})}">
                <input type="hidden" name="version" th:value="${bar.openDraftVersion}">
                <input type="hidden" name="from" th:value="${bar.openDraftFrom}">
                <button type="submit" class="ep-btn ep-btn-primary ep-btn-sm" data-testid="catalog-draft-open">Start the next version</button>
            </form>
        </th:block>
        <th:block th:if="${readiness != null}">
            <a class="ws-status-text" th:href="${overview}" data-testid="ws-pending"
               th:text="${readiness.nothingToPublish} ? 'Everything is published'
                        : (${bar.latestPublished == null} ? 'Not published yet'
                        : (${readiness.onlyOthersChanged} ? 'Changes from other catalogs'
                        : (${readiness.changed.size() == 1} ? '1 change not published' : ${readiness.changed.size()} + ' changes not published')))">2 changes not published</a>
            <button th:if="${readiness.offerPublish}" type="button" class="ep-btn ep-btn-primary ep-btn-sm"
                    data-testid="catalog-bar-publish"
                    th:hx-get="@{/tenants/{t}/catalogs/{c}/release(t=${tenantId},c=${bar.segmentValue})}"
                    hx-target="#release-dialog-container" hx-swap="innerHTML">Publish…</button>
            <span th:if="${bar.publishWithheld and !readiness.nothingToPublish}" class="ws-status-text"
                  data-testid="catalog-bar-publish-withheld">Publishing needs the publisher role</span>
        </th:block>
    </th:block>
</body>
</html>
