<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/* The catalogs a catalog uses (docs/workspace-shell.md): while working its templates see their
           work; publishing ties it to exact published versions of them. Model: the catalog page's. */-->
    <th:block th:fragment="content">
        <div th:replace="~{epistola-web/page-header :: page-header(
            pageTitle='Uses',
            pageDescription='The catalogs ' + ${catalog.name} + ' builds on. Its templates can use their stencils, themes, images and fonts; you change those in the catalog they belong to.'
        )}"></div>
        <div id="catalog-alert"></div>
        <th:block th:if="${readiness != null}">
            <div th:replace="~{catalogs/content :: borrowed}"></div>
            <div th:if="${readiness.borrowing.catalogs.isEmpty()}" class="ep-panel detail-section" data-testid="catalog-uses-none">
                <div class="detail-section-body">
                    <p class="text-muted" style="margin: 0;"
                       th:text="${catalog.name} + ' uses nothing from another catalog yet. When a template uses a stencil, theme or image from one, it shows here.'">Letters uses nothing from another catalog yet.</p>
                </div>
            </div>
        </th:block>
        <div th:if="${readiness == null}" class="ep-panel detail-section" data-testid="catalog-uses-subscribed">
            <div class="detail-section-body">
                <p class="text-muted" style="margin: 0;">What a subscribed catalog uses is decided by its publisher, and installed with it.</p>
            </div>
        </div>
    </th:block>
</body>
</html>
