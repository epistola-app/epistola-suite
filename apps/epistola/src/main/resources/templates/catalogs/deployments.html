<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <!--/* A catalog's deployments (docs/workspace-shell.md): which published version each environment
           serves, deploying another, and fixing what is deployed. Model: the catalog page's. */-->
    <th:block th:fragment="content">
        <div th:replace="~{epistola-web/page-header :: page-header(
            pageTitle='Deployments',
            pageDescription='Which version of ' + ${catalog.name} + ' each environment uses. An application gets documents from the version deployed to its environment.'
        )}"></div>
        <div id="catalog-alert"></div>
        <div th:if="${publicationError != null}" class="alert alert-error" data-testid="catalog-live-error" th:text="${publicationError}"></div>
        <div th:replace="~{catalogs/browse :: live-section}"></div>
    </th:block>
</body>
</html>
