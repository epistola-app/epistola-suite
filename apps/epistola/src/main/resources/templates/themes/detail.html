<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="content">
        <link rel="stylesheet" th:href="@{/editor/theme-editor.css}">

        <!--/* Catalog first, then the resource: the bar says which catalog you are in, the header
               below says what you are editing in it. Kept apart deliberately — see
               catalogs/bar.html. The bar also says read-only for a subscribed catalog, which is why
               no separate notice does. */-->
        <div th:replace="~{catalogs/bar :: catalog-bar(context=${catalogContext})}"></div>

        <div th:replace="~{epistola-web/page-header :: page-header(
            pageTitle=${theme.name},
            backLinkHref=@{/tenants/{tenantId}/themes(tenantId=${tenantId})},
            backLinkLabel='Themes',
            actions=~{::theme-detail-actions}
        )}"></div>

        <div class="ep-panel detail-section theme-settings-panel">
            <div class="detail-section-header">
                <div>
                    <h2>Theme configuration</h2>
                    <span class="theme-panel-subtitle">
                        Last modified <span th:text="${#temporals.format(theme.updatedAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </span>
                </div>
                <!--/* No catalog badge: the bar above names it, links to it and says where it
                       stands. Saying it twice invites the two to disagree. */-->
            </div>
            <div class="detail-section-body theme-editor-panel-body">
                <div id="theme-editor-container"></div>
            </div>
        </div>

        <div th:replace="~{epistola-web/dialog :: dialog-mount}"></div>

        <script type="application/json" id="theme-editor-config" th:inline="javascript">
        {
            "editorModuleUrl": [[@{/editor/theme-editor.js}]],
            "theme": [[${themeJson}]],
            "tenantId": [[${tenantId}]],
            "catalogId": [[${catalogId}]],
            "themeId": [[${theme.id}]],
            "editable": [[${editable}]]
        }
        </script>
        <script type="module" th:src="@{/js/theme-editor-boot.js}"></script>

        <th:block th:replace="~{fragments/confirm-dialog :: confirm-dialog}" />

    </th:block>
    <th:block th:fragment="theme-detail-actions">
        <button type="button" class="ep-btn ep-btn-outline ep-btn-sm"
                data-testid="theme-usage-open-action"
                th:hx-get="@{/tenants/{tenantId}/themes/{catalogId}/{themeId}/usage(tenantId=${tenantId},catalogId=${catalogId},themeId=${theme.id})}"
                hx-target="#dialog-mount" hx-swap="innerHTML">
            View usage
        </button>
        <form th:if="${editable}" id="delete-theme-form"
              th:action="@{/tenants/{tenantId}/themes/{catalogId}/{themeId}/delete(tenantId=${tenantId},catalogId=${catalogId},themeId=${theme.id})}"
              method="post">
            <button type="button" class="ep-btn ep-btn-destructive ep-btn-sm" data-testid="delete-action"
                    data-confirm-submit="delete-theme-form"
                    data-confirm-submit-message="Are you sure you want to delete this theme? Templates using this theme will fall back to their own styles."
                    data-confirm-submit-title="Delete Theme"
                    data-confirm-submit-label="Delete">Delete Theme</button>
        </form>
    </th:block>

</body>
</html>
