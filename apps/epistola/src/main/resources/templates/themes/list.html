<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="content">
        <div th:replace="~{epistola-web/page-header :: page-header(
            pageTitle='Themes',
            searchPlaceholder='Search themes...',
            searchUrl=@{/tenants/{tenantId}/themes/search(tenantId=${tenantId})},
            searchTargetId='theme-rows',
            searchableTotal=${#lists.size(themes)},
            actions=~{::theme-list-actions}
        )}"></div>

        <!--/* Filtered to a catalog with several drafts: which one the rows are from, and the others. */-->

        <!--/* Themes per catalog (contract ADR 0007): the catalog's default theme styles its templates that
               name none; the house theme is the tenant's starting value for catalogs, never rendered with. */-->
        <div th:if="${houseThemeApplied != null}" class="alert alert-success" data-testid="house-theme-applied"
             th:text="${houseThemeApplied == '1'} ? 'The house theme is now the default theme of 1 catalog. It takes effect when it is published.' : 'The house theme is now the default theme of ' + ${houseThemeApplied} + ' catalogs. It takes effect when each is published.'">
            The house theme is now the default theme of 3 catalogs.</div>
        <!--/* Loaded after the page: the catalog's default theme and the presets its themes style
               (catalogs/theme-settings), next to the themes themselves. */-->
        <div th:if="${draftSegment != null}"
             th:hx-get="@{/tenants/{t}/catalogs/{c}/theme-settings(t=${tenantId},c=${draftSegment.value})}"
             hx-trigger="load" hx-swap="outerHTML" data-testid="catalog-theme-settings-mount"></div>
        <form th:if="${!#lists.isEmpty(themes) and auth.has('TENANT_SETTINGS') and tenant?.defaultThemeKey != null}" method="post" hx-boost="false"
              th:action="@{/tenants/{t}/house-theme/apply(t=${tenantId},catalog=${draftSegment?.value})}"
              style="margin-bottom: var(--ep-space-4);" data-testid="theme-defaults">
            <button type="submit" class="ep-btn ep-btn-outline ep-btn-sm" data-testid="house-theme-apply"
                    title="Make the house theme the default theme of every catalog you author; each takes it on its next publish">
                Apply house theme to all catalogs</button>
        </form>

        <div th:if="${#lists.isEmpty(themes)}" class="empty-state">
            <div class="empty-state-icon">
                <th:block th:replace="~{epistola-web/icon :: icon(name='palette', class='ep-icon ep-icon-xl')}" />
            </div>
            <div class="empty-state-title">No themes yet</div>
            <div class="empty-state-description">Create a theme to define the visual styling of your documents.</div>
            <button th:if="${auth.has('THEME_EDIT') and workspace?.catalog?.readOnly != true}" type="button"
                    class="ep-btn ep-btn-primary" style="margin-top: var(--ep-space-4);"
                    th:hx-get="@{/tenants/{tenantId}/catalogs/{catalogSeg}/themes/new(tenantId=${tenantId},catalogSeg=${draftSegment.value})}"
                    hx-target="#dialog-mount" hx-swap="innerHTML" hx-push-url="true"
                    data-testid="theme-create-open">
                <th:block th:replace="~{epistola-web/icon :: icon(name='plus', class='ep-icon')}" />
                New Theme
            </button>
        </div>

        <div th:if="${!#lists.isEmpty(themes)}"
             class="ep-table-scroll" role="region" aria-label="Themes table" tabindex="0"
             data-testid="fixed-table-scroll">
        <table class="ep-table ep-table-fixed">
            <colgroup>
                <col style="width: 26%" /><!-- Name -->
                <col style="width: 14%" /><!-- Catalog -->
                <col style="width: 30%" /><!-- Description -->
                <col style="width: 15%" /><!-- Last Modified -->
                <col style="width: 15%" /><!-- Actions -->
            </colgroup>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Catalog</th>
                    <th>Description</th>
                    <th>Last Modified</th>
                    <th></th>
                </tr>
            </thead>
            <tbody id="theme-rows">
                <th:block th:fragment="rows">
                    <!--/* A search swaps only this fragment, so a "nothing found" message has to live
                           inside it: the empty state outside is never re-rendered, and the reader would
                           otherwise be left looking at an empty table that says nothing. */-->
                    <tr th:if="${#lists.isEmpty(themes) and !#strings.isEmpty(searchTerm)}">
                        <td colspan="5" class="text-muted" style="text-align: center; padding: var(--ep-space-6);"
                            th:text="'No themes match your search.'"></td>
                    </tr>
                    <tr th:each="theme : ${themes}"
                        th:with="isDefault=${tenant?.defaultThemeKey == theme.id and tenant?.defaultThemeCatalogKey == theme.catalogKey},
                                 isCatalogDefault=${catalogDefault != null and catalogDefault.themeKey == theme.id and catalogDefault.catalogKey == theme.catalogKey}">
                        <td th:title="${theme.name}">
                            <!--/* Badge before the name: the cell clips at its end, so a long
                                   name would push a trailing badge out of view entirely. */-->
                            <span th:if="${isCatalogDefault}" class="badge badge-primary" style="margin-right: var(--ep-space-2);" data-testid="theme-catalog-default-badge"
                                  title="Templates of this catalog that name no theme use it">Catalog default</span>
                            <span th:if="${isDefault}" class="badge badge-outline" style="margin-right: var(--ep-space-2);" data-testid="theme-default-badge"
                                  title="The house theme: new catalogs start with it as their default theme">House theme</span>
                            <a th:href="@{/tenants/{tenantId}/catalogs/{catalogId}/themes/{themeId}(tenantId=${tenantId},catalogId=${draftSegment?.linkFor(theme.catalogId) ?: theme.catalogId.address},themeId=${theme.id})}"
                               th:text="${theme.name}" style="font-weight: 500;"></a>
                        </td>
                        <td th:title="${theme.catalogKey}"><span class="badge badge-default" th:text="${theme.catalogKey}"></span></td>
                        <td th:title="${theme.description}">
                            <span th:if="${theme.description != null}" th:text="${theme.description}"></span>
                            <span th:unless="${theme.description != null}" class="text-muted">-</span>
                        </td>
                        <td th:text="${#temporals.format(theme.updatedAt, 'yyyy-MM-dd HH:mm')}" th:data-local-time="${theme.updatedAt}" th:title="${#temporals.format(theme.updatedAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td class="actions">
                            <th:block th:replace="~{fragments/refactoring :: row-action('theme', ${draftSegment?.linkFor(theme.catalogId) ?: theme.catalogId.address}, ${theme.id})}" />
                            <form th:if="${auth.has('TEMPLATE_EDIT') and draftSegment != null and !isCatalogDefault and catalogEditing.editable(theme.catalogKey) and workspace?.catalog?.readOnly != true}"
                                  th:hx-post="@{/tenants/{t}/catalogs/{c}/default-theme(t=${tenantId},c=${draftSegment.value})}"
                                  hx-target="#theme-rows" hx-swap="innerHTML" style="display: inline;">
                                <input type="hidden" name="themeId" th:value="${theme.id}">
                                <input type="hidden" name="themeCatalogKey" th:value="${theme.catalogKey}">
                                <button type="submit" class="ep-btn ep-btn-ghost ep-btn-sm ep-btn-icon" data-testid="theme-make-catalog-default"
                                        title="Use as this catalog's default theme">
                                    <th:block th:replace="~{epistola-web/icon :: icon(name='check-circle', class='ep-icon ep-icon-sm')}" />
                                </button>
                            </form>
                            <form th:if="${auth.has('TENANT_SETTINGS') and !isDefault}"
                                  th:hx-post="@{/tenants/{tenantId}/default-theme(tenantId=${tenantId})}"
                                  hx-target="#theme-rows"
                                  hx-swap="innerHTML"
                                  style="display: inline;">
                                <input type="hidden" name="themeId" th:value="${theme.id}">
                                <input type="hidden" name="catalogKey" th:value="${theme.catalogKey}">
                                <button type="submit" class="ep-btn ep-btn-ghost ep-btn-sm ep-btn-icon" title="Make it the house theme: new catalogs start with it">
                                    <th:block th:replace="~{epistola-web/icon :: icon(name='star', class='ep-icon ep-icon-sm')}" />
                                </button>
                            </form>
                            <form th:if="${auth.has('TENANT_SETTINGS') and isDefault}"
                                  th:hx-post="@{/tenants/{tenantId}/default-theme(tenantId=${tenantId})}"
                                  hx-target="#theme-rows"
                                  hx-swap="innerHTML"
                                  style="display: inline;">
                                <input type="hidden" name="themeId" value="">
                                <button type="submit" class="ep-btn ep-btn-ghost ep-btn-sm ep-btn-icon" title="Stop using it as the house theme">
                                    <th:block th:replace="~{epistola-web/icon :: icon(name='ban', class='ep-icon ep-icon-sm')}" />
                                </button>
                            </form>
                            <th:block th:if="${catalogEditing.editable(theme.catalogKey)}">
                                <a th:href="@{/tenants/{tenantId}/catalogs/{catalogId}/themes/{themeId}(tenantId=${tenantId},catalogId=${draftSegment?.linkFor(theme.catalogId) ?: theme.catalogId.address},themeId=${theme.id})}"
                                   class="ep-btn ep-btn-ghost ep-btn-sm ep-btn-icon" title="Edit theme">
                                    <th:block th:replace="~{epistola-web/icon :: icon(name='pencil', class='ep-icon ep-icon-sm')}" />
                                </a>
                                <button th:if="${auth.has('THEME_EDIT') and !isDefault}"
                                        type="button"
                                        class="ep-btn ep-btn-ghost ep-btn-destructive ep-btn-sm ep-btn-icon"
                                        title="Delete theme"
                                        data-confirm-title="Delete Theme"
                                        th:attr="data-confirm-message='Delete theme &quot;' + ${theme.name} + '&quot;? Templates using it will fall back to their own styles.',data-confirm-url=@{/tenants/{tenantId}/catalogs/{catalogId}/themes/{themeId}/delete(tenantId=${tenantId},catalogId=${draftSegment?.linkFor(theme.catalogId) ?: theme.catalogId.address},themeId=${theme.id})}"
                                        data-confirm-target="#theme-rows">
                                    <th:block th:replace="~{epistola-web/icon :: icon(name='trash-2', class='ep-icon ep-icon-sm')}" />
                                </button>
                            </th:block>
                        </td>
                    </tr>
                </th:block>
            </tbody>
        </table>
        </div>


        <!-- Dialog mount: the create dialog is swapped in here by the trigger
             (hx-get → #dialog-mount) and opened by static/js/behaviors.js. On
             direct navigation to /new the handler renders THIS page with
             openDialog=true, embedding the dialog as a plain <dialog> that the
             same JS opens on load.
             GOTCHA: the openDialog guard MUST wrap the th:replace on an OUTER
             element — th:replace (precedence 100) runs before th:if (300), so
             the two on the SAME element would include the dialog unconditionally.
             See docs/dialog-forms.md. -->
        <div th:replace="~{fragments/from-other-catalogs :: section(${fromOtherCatalogs}, 'themes')}"></div>

        <div id="dialog-mount" data-dialog-mount>
            <th:block th:if="${openDialog}">
                <th:block th:replace="~{themes/new :: dialog}"></th:block>
            </th:block>
        </div>
    </th:block>
    <th:block th:fragment="theme-list-actions">
        <button th:if="${auth.has('THEME_EDIT') and workspace?.catalog?.readOnly != true}" type="button" class="ep-btn ep-btn-primary"
                th:hx-get="@{/tenants/{tenantId}/catalogs/{catalogSeg}/themes/new(tenantId=${tenantId},catalogSeg=${draftSegment.value})}"
                hx-target="#dialog-mount" hx-swap="innerHTML" hx-push-url="true"
                data-testid="theme-create-open-action">
            <th:block th:replace="~{epistola-web/icon :: icon(name='plus', class='ep-icon')}" />
            New Theme
        </button>
    </th:block>

</body>
</html>
