<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${param.popup != null} ? 'Log in - Epistola' : 'Login - Epistola Suite'">Login - Epistola Suite</title>
    <th:block th:replace="~{fragments/styles :: styles}" />
</head>
<body>
    <div class="login-container">
        <div class="login-card" th:classappend="${param.popup != null} ? 'popup-mode' : ''">
            <div class="login-header">
                <h1>Epistola Suite</h1>
                <p th:unless="${param.popup != null}">Document Creation Platform</p>
                <p th:if="${param.popup != null}">Session expired</p>
            </div>

            <!-- Popup mode notice -->
            <div th:if="${param.popup != null}" class="alert alert-info" style="margin-bottom: var(--ep-space-6);">
                Your session has expired. Please log in again to continue.
            </div>

            <!-- Error message -->
            <div th:if="${param.error}" class="alert alert-error">
                <p>Invalid username or password. Please try again.</p>
            </div>

            <!-- Logout success message (don't show in popup mode) -->
            <div th:if="${param.logout != null and param.popup == null}" class="alert alert-success" data-testid="alert-success">
                <p>You have been logged out successfully.</p>
            </div>

            <!-- Form login (shown when local profile is active) -->
            <div th:if="${hasFormLogin}">
                <form th:action="@{/login}" method="post">
                    <!-- Hidden field to preserve popup mode through form POST -->
                    <input th:if="${param.popup != null}" type="hidden" name="popup" value="true">
                    <div class="form-group">
                        <label for="username">Email</label>
                        <input type="text" id="username" name="username" required autofocus autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="ep-btn ep-btn-primary" style="width: 100%;">Sign in</button>
                </form>

                <!--/* Local development only (localAccountHints): the documented default accounts. */-->
                <div th:unless="${#lists.isEmpty(localAccounts)}" class="alert alert-info" data-testid="login-local-accounts"
                     style="margin-top: var(--ep-space-6);">
                    <p style="margin: 0 0 var(--ep-space-2);">Local development accounts:</p>
                    <ul style="margin: 0; padding-left: var(--ep-space-5);">
                        <!--/* Name first, credentials kept on one line: a pair split across lines read as two accounts. */-->
                        <li th:each="account : ${localAccounts}">
                            <span th:text="${account.name} + ':'">Local Admin:</span>
                            <span style="white-space: nowrap;"><code th:text="${account.username}">admin@local</code> /
                            <code th:text="${account.password}">admin</code></span>
                        </li>
                    </ul>
                </div>

            </div>

            <!-- Divider when both login methods are available -->
            <div th:if="${hasFormLogin and hasOAuth2}" class="login-divider">
                <span>or</span>
            </div>

            <!-- OAuth2 login (shown when OAuth2 is configured) -->
            <div th:if="${hasOAuth2}">
                <a th:href="@{/oauth2/authorization/{id}(id=${oauth2RegistrationId}, popup=${param.popup != null ? 'true' : null})}"
                   class="ep-btn ep-btn-outline" style="width: 100%;"
                   th:text="${ssoButtonLabel}">
                    Sign in with SSO
                </a>
            </div>
        </div>
    </div>
</body>
</html>
