<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Epistola'">Epistola</title>
    <th:block th:replace="~{fragments/styles :: styles}" />
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/embed-config :: island}" />
    <th:block th:replace="~{fragments/htmx :: htmx}" />
</head>
<!--/* The workspace shell (docs/workspace-shell.md): the context bar on top, the side nav for the
       place someone is in, the page beside it. Pages without a tenant have no side nav. A boosted
       navigation inside the workspace replaces only #ws-page, with the nav and, when it changed, the
       bar out of band (layout/boosted, ShellModelInterceptor). */-->
<body class="app-shell" hx-boost="true">

    <th:block th:replace="~{layout/nav :: nav}" />

    <th:block th:if="${siteBanner != null}">
        <th:block th:replace="~{fragments/site-banner :: banner}" />
    </th:block>

    <div class="ws-body" th:classappend="${workspace == null} ? 'ws-body-plain' : ''">
        <th:block th:if="${workspace != null}">
            <th:block th:replace="~{layout/nav :: side}" />
        </th:block>
        <div class="ws-main">
            <!--/* What a boosted navigation replaces (layout/boosted): the page, and what belongs to it. */-->
            <div id="ws-page" class="ws-page" th:fragment="page">
                <th:block th:if="${workspace?.catalog?.sideWork}">
                    <th:block th:replace="~{layout/nav :: side-strip}" />
                </th:block>
                <main id="main-content" class="main-content">
                    <div th:replace="~{__${contentView}__ :: content}">Page content</div>
                </main>
                <!--/* The publish dialog, opened from the bar's Publish… and from the catalog's own pages. */-->
                <div th:if="${workspace?.catalog != null}" id="release-dialog-container" data-open-dialog-on-swap="release-dialog"></div>
                <!--/* Dialogs the context bar opens on any catalog page, such as starting long-term work. */-->
                <div th:if="${workspace?.catalog != null}" id="ws-dialog-mount" data-dialog-mount></div>
                <!--/* Which bar and nav this page was rendered with, sent back on the next boosted
                       navigation so the server sends them again only when they change. */-->
                <span id="ws-shell-key" hidden th:attr="data-key=${workspace != null} ? 'nav:' + ${workspace.barKey} : 'plain'"></span>
            </div>
            <th:block th:replace="~{fragments/footer :: footer}" />
        </div>
    </div>
</body>
</html>
