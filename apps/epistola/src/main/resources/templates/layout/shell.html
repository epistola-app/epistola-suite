<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} ?: 'Epistola'">Epistola</title>
    <th:block th:replace="~{fragments/styles :: styles}" />
    <link rel="stylesheet" th:href="@{/css/shell.css}">
    <th:block th:replace="~{fragments/htmx :: htmx}" />
</head>
<body class="app-shell" hx-boost="true">

    <th:block th:replace="~{layout/nav :: nav}" />

    <th:block th:if="${siteBanner != null}">
        <th:block th:replace="~{fragments/site-banner :: banner}" />
    </th:block>

    <main id="main-content" class="main-content">
        <div th:replace="~{__${contentView}__ :: content}">Page content</div>
    </main>

    <th:block th:replace="~{fragments/footer :: footer}" />

    <!-- Corner-notice region (#477): fixed OOB target for epistola-web/notice
         fragments (HtmxDsl.successNotice/errorNotice). Present at load so
         aria-live announces later insertions. Chrome in notice.css; dismissal
         in behaviors.js. -->
    <div id="notices" class="notice-region" aria-live="polite"></div>

    <!-- Client-side notice source for failures with no server HTML to render
         (network errors, unshaped 4xx/5xx — the notices.js safety net).
         The one place a notice is client-built: JS clones this and fills
         .notice-message, so the markup stays single-sourced in the fragment. -->
    <template id="notice-template">
        <th:block th:replace="~{epistola-web/notice :: notice('error', null, '')}" />
    </template>
</body>
</html>
