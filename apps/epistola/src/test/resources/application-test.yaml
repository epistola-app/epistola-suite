spring:
  main:
    banner-mode: off
  datasource:
    hikari:
      # See modules/epistola-core/src/test/resources/application-test.yml: one shared Postgres,
      # many cached contexts, so an idle floor per context is a cost that scales with contexts.
      maximum-pool-size: 8
      minimum-idle: 0
      idle-timeout: 10000

# PrometheusEndpointTest reads these; setting them for every test lets it share the base context.
management:
  # The actuator keeps its own port in tests, as in every installation, but a random one: a fixed
  # port would collide between test contexts.
  server:
    port: 0
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-components: always

logging:
  level:
    app.epistola.suite.documents.batch: INFO

# Tests use permit-all security (see SecurityConfig.testSecurityFilterChain)
# No OAuth2 configuration needed

epistola:
  # Tests never reach the real product domain: `.invalid` never resolves (RFC 2606), so a test that
  # forgets to stub discovery fails fast onto the built-in fallbacks instead of calling epistola.app.
  product-domain: epistola.invalid
  logs:
    # Don't attach the DB log appender across the whole suite — capture/retention
    # tests opt in per-class with properties = ["epistola.logs.enabled=true"].
    enabled: false
  storage:
    backend: memory
  auth:
    auto-provision: false # Not needed for in-memory test users
  demo:
    enabled: false # Disable demo loading in tests
  # Tests never reach epistola.app: should a daily check fire during a run, it fails fast on the
  # discard port instead. Tests that exercise the checks drive them directly.
  version-check:
    endpoint: "http://127.0.0.1:9/.well-known/epistola/releases.json"
  installation-check:
    endpoint: "http://127.0.0.1:9/installation/{id}.json"
  catalog:
    # Tests write file: catalogs to temp directories under java.io.tmpdir; anywhere else is refused.
    file-roots:
      - ${java.io.tmpdir}
    upstream-check:
      # Off across the suite. It is a background task that reaches out to every subscribed
      # catalog's source, so leaving it on would have unrelated tests making network calls and
      # holding pooled connections. Tests that exercise it drive the worker directly.
      enabled: false
  generation:
    polling:
      enabled: false # App tests use the fake executor; no JobPoller needed
      interval-ms: 500
      max-concurrent-jobs: 5
      stale-timeout-minutes: 1
    async:
      concurrency: 20
