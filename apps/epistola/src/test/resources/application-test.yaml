spring:
  main:
    banner-mode: off
  datasource:
    hikari:
      # See modules/epistola-core/src/test/resources/application-test.yml: one shared Postgres,
      # many cached contexts, so an idle floor per context is a cost that scales with contexts.
      maximum-pool-size: 8
      minimum-idle: 0
      idle-timeout: 10000

# PrometheusEndpointTest reads these; setting them for every test lets it share the base context.
management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoint:
    health:
      show-components: always

logging:
  level:
    app.epistola.suite.documents.batch: INFO

# Tests use permit-all security (see SecurityConfig.testSecurityFilterChain)
# No OAuth2 configuration needed

epistola:
  logs:
    # Don't attach the DB log appender across the whole suite — capture/retention
    # tests opt in per-class with properties = ["epistola.logs.enabled=true"].
    enabled: false
  storage:
    backend: memory
  auth:
    auto-provision: false # Not needed for in-memory test users
  demo:
    enabled: false # Disable demo loading in tests
  generation:
    polling:
      enabled: false # App tests use the fake executor; no JobPoller needed
      interval-ms: 500
      max-concurrent-jobs: 5
      stale-timeout-minutes: 1
    async:
      concurrency: 20
